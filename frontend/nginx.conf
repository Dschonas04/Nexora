# Two entrances to the same application: unencrypted and encrypted.
#
# The unencrypted one stays, because an instance in a home network would
# otherwise be unreachable after a rebuild, and because forcing HTTPS with a self
# signed certificate produces mainly one thing: warnings one clicks away until
# one stops reading them.
#
# The certificate comes into being on the first start, see tls-start.sh.
#
# Towards the back it is encrypted as well: the service is addressed over HTTPS,
# and its certificate is checked against the compound's own authority (see
# pki/erzeuge.sh). Without that check the encryption would be a reassurance and
# not a statement -- whoever does not look who they are talking to may well be
# talking encrypted to the wrong party.
#
# Scheme and port stand there as placeholders and are substituted at start-up,
# see tls-start.sh. Whoever runs the service without a certificate sets
# NEXORA_DIENST_SCHEMA=http and NEXORA_DIENST_PORT=8080.

server {
    listen 80;
    listen 443 ssl;
    http2 on;
    server_name _;

    # Generated on start when it does not exist. A real certificate is placed
    # under the same name, and then it stays untouched.
    ssl_certificate     /etc/nginx/tls/zertifikat.pem;
    ssl_certificate_key /etc/nginx/tls/schluessel.pem;
    # Only the two versions considered sound today. Offering older ones would
    # mean using them as soon as somebody asks for them.
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:2m;
    ssl_session_timeout 1h;

    # Towards the back: the service's certificate is checked, against the
    # compound's own authority. proxy_ssl_name has to stand there expressly --
    # the target comes out of a variable, and then nginx does not take the name
    # out of the address by itself.
    proxy_ssl_trusted_certificate /pki/ca.crt;
    proxy_ssl_verify              on;
    proxy_ssl_verify_depth        2;
    proxy_ssl_name                backend;
    proxy_ssl_server_name         on;
    proxy_ssl_protocols           TLSv1.2 TLSv1.3;
    root /usr/share/nginx/html;
    index index.html;

    # Generous, and that on purpose. The actual limit for an attachment is
    # max_anhang_mb in the backend, and only there can it be adjusted and
    # justified at runtime: whoever uploads too much gets an answer from Nexora
    # saying how much is allowed. If the narrower value stood here, nginx would
    # break off first, and the user would see an error from a service they know
    # nothing about, while the setting in the panel shows a number that does not
    # apply. That was exactly the case until 08/2026: 25m stood here, and a
    # higher max_anhang_mb would have had no effect.
    #
    # The value is no protective measure, it is only the ceiling the backend may
    # decide under. The truly effective limit can be measured under Settings,
    # Attachments.
    client_max_body_size 512m;

    # What is delivered is a good megabyte of JavaScript and barely a fifth of
    # that in styles. Uncompressed that is noticeable even in one's own network
    # and clearly so over a line from outside; compressed about a third is
    # left.
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types
        text/plain
        text/css
        application/javascript
        application/json
        image/svg+xml
        application/manifest+json;

    # The policy for the application itself.
    #
    # It stands here and not in the service, because only this place knows the
    # bundles it has to permit. The service sets its own, narrower policy for
    # its answers; that is also why this does not stand at server level, or
    # every API answer would carry two of them.
    #
    # What every single entry here is doing:
    #   style-src 'unsafe-inline'  BlockNote and Mantine set styles on the
    #                              element; without it the editor breaks.
    #   img-src blob:              the preview of a chosen profile picture
    #                              comes into being through createObjectURL.
    #   worker-src blob:           pdf.js creates its worker that way.
    #   object-src 'self'          the PDF preview is an <object> pointing at an
    #                              attachment of ours. 'none' would be nicer
    #                              and takes the preview along.
    #   connect-src 'self'         under CSP3 this also covers the ws
    #                              connection to the same origin that writing
    #                              together uses.
    set $nexora_csp "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'self'; worker-src 'self' blob:; frame-ancestors 'none'; base-uri 'self'";

    # The names under /assets/ carry the content hash: when something changes,
    # the name changes. They may therefore stay in the cache indefinitely, and
    # every further call then manages without a request.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # The entry page on the other hand is never held: it names the bundles, and
    # an old version would point at files that no longer exist after the next
    # rollout.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header Content-Security-Policy $nexora_csp always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
    }

    # API + auth cookies proxied to the Go backend
    # Restoring goes in the other direction: one large upload.
    #
    # client_max_body_size stands globally at 512m, and a backup may be larger
    # than a single attachment is allowed to be. Without this block nginx breaks
    # the upload off before Nexora sees it, and the error message would come
    # from a service the user knows nothing about.
    location = /api/system/wiederherstellung {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $einspielen backend;
        proxy_pass ${NEXORA_DIENST_SCHEMA}://$einspielen:${NEXORA_DIENST_PORT}$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Eight gigabytes, the same limit the service itself draws.
        client_max_body_size 8g;
        # Pass through instead of collecting it in full first: otherwise the
        # archive lies on the disk twice, once at nginx and once at the
        # service.
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # The backup is a stream and not a document.
    #
    # A block of its own, because the defaults are exactly wrong here. nginx
    # normally collects an answer in full before passing it on; with a backup of
    # several gigabytes that fills the container's disk and makes the download
    # look dead for minutes. And proxy_read_timeout stands at one minute, which
    # is too tight for pg_dump on a larger database.
    location = /api/system/sicherung {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $sicherung backend;
        proxy_pass ${NEXORA_DIENST_SCHEMA}://$sicherung:${NEXORA_DIENST_PORT}$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Durchreichen statt einsammeln.
        proxy_buffering off;
        proxy_request_buffering off;
        # One hour. Not as an expectation but as an upper bound: a backup
        # taking longer has a different problem.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        # The service sets X-Accel-Buffering: no; this here is the belt to go
        # with it, so that it holds even when somebody removes the header.
        chunked_transfer_encoding on;
    }

    # The wire for editing together.
    #
    # A block of its own, because two defaults are exactly wrong here. nginx
    # only passes the upgrade to WebSocket on when told to: without the two
    # Upgrade headers and HTTP/1.1 it answers 400, and the interface retries
    # endlessly. And proxy_read_timeout stands at one minute, while a session
    # lasts hours and is quiet in between now and then.
    location /api/echtzeit/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $mitschrift backend;
        proxy_pass ${NEXORA_DIENST_SCHEMA}://$mitschrift:${NEXORA_DIENST_PORT}$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header Origin $http_origin;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # One day. Not as an expectation but as an upper bound: a tab standing
        # open that long has been forgotten, and then it may fall shut.
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        # Collect nothing: every packet is meant for the recipient at once.
        proxy_buffering off;
    }

    location /api/ {
        # The name is resolved on EVERY request, not once at startup.
        #
        # Otherwise nginx remembers the backend's address while coming up and
        # holds on to it. If a new container is started there, which happens on
        # every rollout touching only the backend, that one gets a new address,
        # and nginx keeps talking to one where nobody is any more: the interface
        # loads, every API call answers with 502, and it stays that way until the
        # server for the files restarts too.
        #
        # The detour through a variable is the place where that tips over: with a
        # fixed name nginx resolves at startup, with a variable at runtime.
        # 127.0.0.11 is the name service Docker places beside every container.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $dienst backend;
        # $request_uri has to be appended explicitly: as soon as the name comes
        # from a variable, nginx no longer appends the path by itself.
        proxy_pass ${NEXORA_DIENST_SCHEMA}://$dienst:${NEXORA_DIENST_PORT}$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback
    location / {
        add_header Content-Security-Policy $nexora_csp always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        try_files $uri $uri/ /index.html;
    }
}
