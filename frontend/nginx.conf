server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 25m;

    # Ausgeliefert wird gut ein Megabyte JavaScript und ein knappes Fünftel
    # davon an Stilen. Ungepackt ist das auch im eigenen Netz spürbar und über
    # eine Leitung von außen deutlich; gepackt bleibt rund ein Drittel übrig.
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types
        text/plain
        text/css
        application/javascript
        application/json
        image/svg+xml
        application/manifest+json;

    # Die Namen unter /assets/ tragen den Inhaltsstempel: ändert sich etwas,
    # ändert sich der Name. Deshalb dürfen sie unbefristet im Zwischenspeicher
    # bleiben -- jeder weitere Aufruf kommt dann ohne Anfrage aus.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Die Einstiegsseite dagegen nie festhalten: sie nennt die Namen der
    # Bündel, und eine alte Fassung würde auf Dateien zeigen, die es nach dem
    # nächsten Ausrollen nicht mehr gibt.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # API + auth cookies proxied to the Go backend
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
