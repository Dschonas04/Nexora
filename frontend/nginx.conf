# Zwei Eingänge auf dieselbe Anwendung: unverschlüsselt und verschlüsselt.
#
# Der unverschlüsselte bleibt bestehen, weil eine Instanz im Heimnetz sonst nach
# einem Neubau nicht mehr erreichbar wäre -- und weil ein Zwang zu HTTPS mit
# einem selbst ausgestellten Zertifikat vor allem eines erzeugt: Warnungen, die
# man wegklickt, bis man sie nicht mehr liest.
#
# Das Zertifikat entsteht beim ersten Start, siehe tls-start.sh.

server {
    listen 80;
    listen 443 ssl;
    http2 on;
    server_name _;

    # Wird beim Start erzeugt, falls nicht vorhanden. Ein echtes Zertifikat
    # legt man unter demselben Namen ab, dann bleibt es unangetastet.
    ssl_certificate     /etc/nginx/tls/zertifikat.pem;
    ssl_certificate_key /etc/nginx/tls/schluessel.pem;
    # Nur noch die beiden Fassungen, die heute als tragfähig gelten. Ältere
    # anzubieten hieße, sie auch zu benutzen, sobald jemand danach fragt.
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:2m;
    ssl_session_timeout 1h;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 25m;

    # Ausgeliefert wird gut ein Megabyte JavaScript und ein knappes Fünftel
    # davon an Stilen. Ungepackt ist das auch im eigenen Netz spürbar und über
    # eine Leitung von außen deutlich; gepackt bleibt rund ein Drittel übrig.
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types
        text/plain
        text/css
        application/javascript
        application/json
        image/svg+xml
        application/manifest+json;

    # Die Namen unter /assets/ tragen den Inhaltsstempel: ändert sich etwas,
    # ändert sich der Name. Deshalb dürfen sie unbefristet im Zwischenspeicher
    # bleiben -- jeder weitere Aufruf kommt dann ohne Anfrage aus.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Die Einstiegsseite dagegen nie festhalten: sie nennt die Namen der
    # Bündel, und eine alte Fassung würde auf Dateien zeigen, die es nach dem
    # nächsten Ausrollen nicht mehr gibt.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # API + auth cookies proxied to the Go backend
    location /api/ {
        # Der Name wird bei JEDER Anfrage aufgelöst, nicht einmal beim Start.
        #
        # nginx merkt sich sonst die Adresse des Backends beim Hochfahren und
        # hält daran fest. Wird dort ein neuer Container gestartet -- also bei
        # jedem Ausrollen, das nur das Backend betrifft --, bekommt der eine
        # neue Adresse, und nginx redet weiter mit einer, an der niemand mehr
        # ist: die Oberfläche lädt, jeder API-Aufruf antwortet mit 502, und das
        # bleibt so, bis auch der Auslieferer neu startet.
        #
        # Der Umweg über eine Variable ist die Stelle, an der das kippt: mit
        # einem festen Namen löst nginx beim Start auf, mit einer Variablen zur
        # Laufzeit. 127.0.0.11 ist der Namensdienst, den Docker jedem Container
        # beistellt.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $dienst backend;
        # $request_uri muss ausdrücklich dran: sobald der Name aus einer
        # Variablen kommt, hängt nginx den Pfad nicht mehr von selbst an.
        proxy_pass http://$dienst:8080$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
