# Two entrances to the same application: unencrypted and encrypted.
#
# The unencrypted one stays, because an instance in a home network would
# otherwise be unreachable after a rebuild, and because forcing HTTPS with a self
# signed certificate produces mainly one thing: warnings one clicks away until
# one stops reading them.
#
# The certificate comes into being on the first start, see tls-start.sh.
#
# Nach hinten heraus ist es ebenfalls verschlüsselt: der Dienst wird über HTTPS
# angesprochen, und sein Zertifikat wird gegen die eigene Stelle des Verbunds
# geprüft (siehe pki/erzeuge.sh). Ohne diese Prüfung wäre die Verschlüsselung
# eine Beruhigung und keine Aussage -- wer nicht nachsieht, mit wem er spricht,
# spricht unter Umständen verschlüsselt mit dem Falschen.
#
# Schema und Port stehen als Platzhalter da und werden beim Start eingesetzt,
# siehe tls-start.sh. Wer den Dienst ohne Zertifikat betreibt, setzt
# NEXORA_DIENST_SCHEMA=http und NEXORA_DIENST_PORT=8080.

server {
    listen 80;
    listen 443 ssl;
    http2 on;
    server_name _;

    # Generated on start when it does not exist. A real certificate is placed
    # under the same name, and then it stays untouched.
    ssl_certificate     /etc/nginx/tls/zertifikat.pem;
    ssl_certificate_key /etc/nginx/tls/schluessel.pem;
    # Only the two versions considered sound today. Offering older ones would
    # mean using them as soon as somebody asks for them.
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:2m;
    ssl_session_timeout 1h;

    # Nach hinten: das Zertifikat des Dienstes wird geprüft, gegen die eigene
    # Stelle des Verbunds. proxy_ssl_name muss dabei ausdrücklich dastehen --
    # das Ziel kommt aus einer Variablen, und dann nimmt nginx den Namen nicht
    # von selbst aus der Adresse.
    proxy_ssl_trusted_certificate /pki/ca.crt;
    proxy_ssl_verify              on;
    proxy_ssl_verify_depth        2;
    proxy_ssl_name                backend;
    proxy_ssl_server_name         on;
    proxy_ssl_protocols           TLSv1.2 TLSv1.3;
    root /usr/share/nginx/html;
    index index.html;

    # Grosszuegig, und das mit Absicht. Die eigentliche Grenze fuer einen Anhang
    # ist max_anhang_mb im Backend, und nur dort laesst sie sich zur Laufzeit
    # verstellen und begruenden: wer zu viel hochlaedt, bekommt von Nexora eine
    # Antwort, die sagt, wie viel erlaubt ist. Stuende hier der engere Wert,
    # bräche nginx vorher ab, und der Benutzer saehe einen Fehler von einem
    # Dienst, von dem er nichts weiss, waehrend die Einstellung im Panel eine
    # Zahl anzeigt, die nicht gilt. Genau das war bis 08/2026 der Fall: hier
    # standen 25m, und ein hoeheres max_anhang_mb waere wirkungslos geblieben.
    #
    # Der Wert ist keine Schutzmassnahme, er ist nur die Decke, unter der das
    # Backend entscheiden darf. Messen laesst sich die wirklich wirksame Grenze
    # unter Einstellungen, Anhaenge.
    client_max_body_size 512m;

    # What is delivered is a good megabyte of JavaScript and barely a fifth of
    # that in styles. Uncompressed that is noticeable even in one's own network
    # and clearly so over a line from outside; compressed about a third is
    # left.
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types
        text/plain
        text/css
        application/javascript
        application/json
        image/svg+xml
        application/manifest+json;

    # Die Politik fuer die Anwendung selbst.
    #
    # Sie steht hier und nicht im Dienst, weil nur diese Stelle die Buendel
    # kennt, die sie erlauben muss. Der Dienst setzt seine eigene, engere
    # Politik fuer seine Antworten; deshalb steht das hier auch nicht auf
    # Server-Ebene, sonst traegt jede API-Antwort zwei davon.
    #
    # Was jede einzelne Angabe hier zu suchen hat:
    #   style-src 'unsafe-inline'  BlockNote und Mantine setzen Stile am
    #                              Element, ohne geht der Editor kaputt.
    #   img-src blob:              die Vorschau eines gewaehlten Profilbildes
    #                              entsteht per createObjectURL.
    #   worker-src blob:           pdf.js legt seinen Arbeiter so an.
    #   object-src 'self'          die PDF-Vorschau ist ein <object> auf einen
    #                              eigenen Anhang. 'none' waere schoener und
    #                              nimmt die Vorschau mit.
    #   connect-src 'self'         deckt nach CSP3 auch die ws-Verbindung zum
    #                              selben Ursprung ab, die das gemeinsame
    #                              Bearbeiten benutzt.
    set $nexora_csp "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'self'; worker-src 'self' blob:; frame-ancestors 'none'; base-uri 'self'";

    # The names under /assets/ carry the content hash: when something changes,
    # the name changes. They may therefore stay in the cache indefinitely, and
    # every further call then manages without a request.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # The entry page on the other hand is never held: it names the bundles, and
    # an old version would point at files that no longer exist after the next
    # rollout.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header Content-Security-Policy $nexora_csp always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
    }

    # API + auth cookies proxied to the Go backend
    # Das Einspielen geht in die andere Richtung: ein grosser Upload.
    #
    # client_max_body_size steht global auf 512m, und eine Sicherung darf
    # groesser sein als das, was ein einzelner Anhang sein darf. Ohne diesen
    # Block bricht nginx den Upload ab, bevor Nexora ihn sieht, und die
    # Fehlermeldung kaeme von einem Dienst, von dem der Benutzer nichts weiss.
    location = /api/system/wiederherstellung {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $einspielen backend;
        proxy_pass ${NEXORA_DIENST_SCHEMA}://$einspielen:${NEXORA_DIENST_PORT}$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Acht Gigabyte, dieselbe Grenze, die der Dienst selbst zieht.
        client_max_body_size 8g;
        # Durchreichen statt erst vollstaendig einsammeln: sonst liegt das
        # Archiv zweimal auf der Platte, einmal bei nginx und einmal beim
        # Dienst.
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Die Sicherung ist ein Strom und kein Dokument.
    #
    # Ein eigener Block, weil die Vorgaben hier genau falsch sind. nginx sammelt
    # eine Antwort normalerweise erst vollstaendig ein, bevor es sie
    # weiterreicht; bei einer Sicherung von mehreren Gigabyte fuellt das die
    # Platte des Containers und laesst den Download minutenlang tot aussehen.
    # Und proxy_read_timeout steht auf einer Minute, was fuer pg_dump auf einer
    # groesseren Datenbank zu knapp ist.
    location = /api/system/sicherung {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $sicherung backend;
        proxy_pass ${NEXORA_DIENST_SCHEMA}://$sicherung:${NEXORA_DIENST_PORT}$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Durchreichen statt einsammeln.
        proxy_buffering off;
        proxy_request_buffering off;
        # Eine Stunde. Nicht als Erwartung, sondern als Obergrenze: eine
        # Sicherung, die laenger braucht, hat ein anderes Problem.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        # Der Dienst setzt X-Accel-Buffering: no; das hier ist der Guertel
        # dazu, damit es auch dann stimmt, wenn jemand den Kopf entfernt.
        chunked_transfer_encoding on;
    }

    # Die Leitung für das gemeinsame Bearbeiten.
    #
    # Ein eigener Block, weil hier zwei Vorgaben genau falsch sind. nginx reicht
    # den Aufschlag auf WebSocket nur weiter, wenn man es ihm sagt: ohne die
    # beiden Upgrade-Köpfe und HTTP/1.1 antwortet es mit 400, und die Oberfläche
    # versucht es endlos neu. Und proxy_read_timeout steht auf einer Minute,
    # während eine Sitzung Stunden dauert und dazwischen ruhig auch einmal still
    # ist.
    location /api/echtzeit/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $mitschrift backend;
        proxy_pass ${NEXORA_DIENST_SCHEMA}://$mitschrift:${NEXORA_DIENST_PORT}$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header Origin $http_origin;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Ein Tag. Nicht als Erwartung, sondern als Obergrenze: ein Reiter, der
        # so lange offen steht, ist vergessen worden, und dann darf er zufallen.
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        # Nichts sammeln: jedes Paket ist sofort für den Empfänger bestimmt.
        proxy_buffering off;
    }

    location /api/ {
        # The name is resolved on EVERY request, not once at startup.
        #
        # Otherwise nginx remembers the backend's address while coming up and
        # holds on to it. If a new container is started there, which happens on
        # every rollout touching only the backend, that one gets a new address,
        # and nginx keeps talking to one where nobody is any more: the interface
        # loads, every API call answers with 502, and it stays that way until the
        # server for the files restarts too.
        #
        # The detour through a variable is the place where that tips over: with a
        # fixed name nginx resolves at startup, with a variable at runtime.
        # 127.0.0.11 is the name service Docker places beside every container.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $dienst backend;
        # $request_uri has to be appended explicitly: as soon as the name comes
        # from a variable, nginx no longer appends the path by itself.
        proxy_pass ${NEXORA_DIENST_SCHEMA}://$dienst:${NEXORA_DIENST_PORT}$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback
    location / {
        add_header Content-Security-Policy $nexora_csp always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        try_files $uri $uri/ /index.html;
    }
}
