# One file that stands on its own: Nexora together with its database, from
# published images, without .env and without a source tree.
#
# Meant for the interfaces where a stack is pasted in and "deploy" is pressed --
# Portainer, Coolify, Dokploy, Komodo -- and for a quick try on an empty
# machine:
#
#     curl -O https://raw.githubusercontent.com/Dschonas04/Nexora/main/docker-compose.stack.yml
#     docker compose -f docker-compose.stack.yml up -d
#
# CHANGE TWO VALUES before this runs anywhere for real: POSTGRES_PASSWORD and
# JWT_SECRET. The second one signs the sessions; if it stays at the example
# value, anyone who knows it can pass for anyone. A long random value:
#
#     openssl rand -hex 32
#
# The images come from the GitHub registry (ghcr.io/dschonas04). Whoever
# prefers Docker Hub sets NEXORA_REGISTRY=dschohnas -- the same images, the same
# tags, amd64 and arm64. NEXORA_VERSION fixes the version (default: latest).
#
# Whoever already has a database does not take this stack but the main file
# together with docker-compose.image.yml, and sets DATABASE_URL.
#
# Everything beyond that -- attachments in an S3 bucket, Redis in front, mail
# over SMTP, certificates of one's own -- is in docs/configuration.md and works
# here through the same environment variables.
#
# NEXORA_FASSUNG and NEXORA_OEFFENTLICHE_ADRESSE were the earlier names of
# NEXORA_VERSION and NEXORA_PUBLIC_URL; both are still read, so an existing
# setup keeps working.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: nexora
      POSTGRES_USER: nexora
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nexora-bitte-aendern}
    volumes:
      - nexora_db:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U nexora -d nexora']
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # Runs once, sets up a small certificate authority of its own and is then
  # done. That way the traffic between the containers is encrypted as well.
  pki:
    image: ${NEXORA_REGISTRY:-ghcr.io/dschonas04}/nexora-pki:${NEXORA_VERSION:-${NEXORA_FASSUNG:-latest}}
    volumes:
      - nexora_pki:/pki
    restart: 'no'

  backend:
    image: ${NEXORA_REGISTRY:-ghcr.io/dschonas04}/nexora-backend:${NEXORA_VERSION:-${NEXORA_FASSUNG:-latest}}
    # Asks /healthz, which also pings the database. Written with the shell and
    # wget so it works on every image, including those from before the binary
    # learnt "nexora healthcheck".
    healthcheck:
      test: ["CMD-SHELL", "[ -n \"$$NEXORA_TLS_CERTIFICATE\" ] && s=https || s=http; wget -q -O /dev/null --no-check-certificate $$s://127.0.0.1:$${PORT:-8080}/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on:
      db:
        condition: service_healthy
      pki:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgres://nexora:${POSTGRES_PASSWORD:-nexora-bitte-aendern}@db:5432/nexora?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:-bitte-aendern-openssl-rand-hex-32}
      PORT: '8443'
      NEXORA_TLS_CERTIFICATE: /pki/backend/backend.crt
      NEXORA_TLS_KEY: /pki/backend/backend.key
      NEXORA_TLS_ROOT: /pki/ca.crt
      NEXORA_ATTACHMENT_PATH: /data/attachments
    volumes:
      - nexora_files:/data/attachments
      - nexora_pki:/pki:ro
    restart: unless-stopped

  frontend:
    image: ${NEXORA_REGISTRY:-ghcr.io/dschonas04}/nexora-frontend:${NEXORA_VERSION:-${NEXORA_FASSUNG:-latest}}
    # Only that nginx answers; whether the service behind it does is the
    # backend's own check.
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    depends_on:
      pki:
        condition: service_completed_successfully
      backend:
        condition: service_healthy
    ports:
      - '${PORT:-3000}:80'
      - '${PORT_TLS:-3443}:443'
    environment:
      NEXORA_SERVICE_SCHEME: https
      NEXORA_SERVICE_PORT: '8443'
      # The address the instance can be reached at from outside. Only with it
      # may a search engine take in the login page; without it robots.txt keeps
      # every crawler out. See docs/seo.md.
      NEXORA_PUBLIC_URL: ${NEXORA_PUBLIC_URL:-${NEXORA_OEFFENTLICHE_ADRESSE:-}}
    volumes:
      - nexora_tls:/etc/nginx/tls
      - nexora_pki:/pki:ro
    restart: unless-stopped

volumes:
  nexora_db:
  nexora_files:
  nexora_pki:
  nexora_tls:
