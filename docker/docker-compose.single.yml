# Nexora in a single container: database, service and web server in one image,
# one volume, nothing else to set. The quickest way to try Nexora, and enough
# for a small team on a small machine.
#
#     curl -O https://raw.githubusercontent.com/Dschonas04/Nexora/main/docker/docker-compose.single.yml
#     docker compose -f docker-compose.single.yml up -d
#
# Then open https://localhost:3443. The certificate is self-signed and made on
# the first start, so the browser warns once. http://localhost:3000 only
# redirects there: passwords and the session cookie never travel unencrypted.
# Whoever publishes 443 under another port sets NEXORA_HTTPS_PORT to it, and
# NEXORA_HTTPS_ONLY=0 switches the plain entrance back on. The first account
# that registers becomes the administrator.
#
# What it is and what it is not: the free Standard scope only, no licence key is
# read. Everything runs in one process tree, so it scales no further than the
# machine and cannot be split up later without a backup and a restore. For Pro
# or Business, or for more than a handful of people writing at once, take
# docker-compose.stack.yml.
#
# The session secret is generated on the first start and kept in the volume.
# Whoever wants to set it, sets JWT_SECRET. NEXORA_REGISTRY=dschohnas pulls from
# Docker Hub instead, NEXORA_VERSION pins a version (default: latest).
# The project keeps the name it had while these files stood at the top of the
# repository. Compose would otherwise take the directory name, "docker", and
# start a second set of containers and empty volumes next to the old ones.
# COMPOSE_PROJECT_NAME in the .env still wins, for a second instance.
name: nexora

services:
  nexora:
    image: ${NEXORA_REGISTRY:-ghcr.io/dschonas04}/nexora-single:${NEXORA_VERSION:-latest}
    ports:
      - '3443:443'   # https, self-signed certificate
      - '3000:80'    # only redirects to https
    environment:
      NEXORA_HTTPS_PORT: '3443'
      # NEXORA_TLS_NAME: nexora.example.lan   # name in the certificate
      # NEXORA_TLS_IP: 192.168.1.20          # address in the certificate
    volumes:
      - nexora_data:/data
    restart: unless-stopped

volumes:
  nexora_data:
