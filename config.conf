# =============================================================================
#  Nexora — Konfiguration
# =============================================================================
#
#  Diese Datei ist vollständig optional. Jede Einstellung hat eine Vorgabe, die
#  einen lauffähigen Server ergibt — ohne config.conf startet Nexora trotzdem.
#
#  RANGFOLGE, höchste zuerst:
#
#      1. Umgebungsvariable
#      2. Eintrag in dieser Datei
#      3. eingebaute Vorgabe
#
#  Die Umgebung schlägt die Datei mit Absicht: so lässt sich im Container ein
#  einzelner Wert überschreiben, ohne das Abbild neu zu bauen, und ein Geheimnis
#  muss nie auf die Platte. Der Name der Umgebungsvariablen steht bei jedem
#  Eintrag dabei.
#
#  FUNDORT, in dieser Reihenfolge:
#      $NEXORA_CONFIG   →   ./config.conf   →   /etc/nexora/config.conf
#
#  FORMAT:
#      schluessel = wert          ein Eintrag je Zeile
#      # oder ;                   leitet einen Kommentar ein
#      [Abschnitt]                nur zur Gliederung, wird überlesen
#      "  wert mit Rand  "        Anführungszeichen erhalten Leerzeichen
#
#  Ja/Nein-Werte verstehen: ja nein, true false, an aus, 1 0, yes no, on off
#
#  GEHEIMNISSE: Diese Datei liegt im Repository und enthält deshalb nur
#  Vorgaben und Beispiele. Echte Passwörter, Lizenzschlüssel und das
#  JWT-Geheimnis gehören entweder
#
#      a) in Umgebungsvariablen (schlagen die Datei, siehe Rangfolge), oder
#      b) in eine eigene Kopie außerhalb des Repositorys, die über
#         NEXORA_CONFIG angegeben wird — dann chmod 600.
#
# =============================================================================


[Server]

# Port, auf dem die API lauscht. Im Compose-Verbund spricht nur das Frontend
# damit; nach außen geht Port 3000 des nginx.
#   Umgebung: PORT     Vorgabe: 8080
port = 8080

# Verzeichnis für hochgeladene Anhänge. Muss ein dauerhaftes Volume sein —
# liegt es im Container-Dateisystem, sind die Dateien nach jedem Neubau weg.
#   Umgebung: NEXORA_DATA_DIR     Vorgabe: /data/attachments
daten_verzeichnis = /data/attachments

# Absolute Adresse, unter der Nexora von außen erreichbar ist, ohne Schrägstrich
# am Ende. Wird für die Rücksprungadresse bei OIDC gebraucht und sonst nirgends.
# Leer lassen, solange OIDC aus ist.
#   Umgebung: NEXORA_PUBLIC_URL     Vorgabe: leer
# oeffentliche_url = https://wiki.example.de


[Datenbank]

# Verbindung zur PostgreSQL-Datenbank. Das Schema wird bei jedem Start
# angewandt und ist wiederholbar — eine frische und eine bestehende Datenbank
# landen beim selben Stand.
#
# ACHTUNG: Enthält das Passwort. Deshalb steht diese Datei auf chmod 600.
# Alternativ die Umgebungsvariable benutzen und den Eintrag hier weglassen.
#   Umgebung: DATABASE_URL
datenbank_url = postgres://nexora:nexora@db:5432/nexora?sslmode=disable


[Sitzungen]

# Geheimnis, mit dem Sitzungs-Token unterschrieben werden.
#
# UNBEDINGT ÄNDERN. Wer es kennt, kann sich als jeder Benutzer ausgeben.
# Erzeugen mit:   openssl rand -hex 32
#
# Ein Wechsel meldet alle Benutzer ab — das ist der schnellste Weg, sämtliche
# Sitzungen ungültig zu machen, wenn etwas abhandengekommen ist.
#   Umgebung: JWT_SECRET
jwt_geheimnis = change-me-in-production

# Wie lange eine Anmeldung gilt. Es gibt keine Verlängerung und keine Liste
# offener Sitzungen: ein Token bleibt bis zum Ablauf brauchbar, auch nach einer
# Passwortänderung. Kürzer ist sicherer, länger ist bequemer.
#   Umgebung: NEXORA_SESSION_DAYS     Vorgabe: 7
sitzung_tage = 7


[Lizenz]

# Lizenzschlüssel für die kostenpflichtigen Zusätze.
#
# Ohne Schlüssel läuft Nexora mit dem freien Umfang; gesperrte Aufrufe
# antworten mit 402. Ein kaputter Schlüssel verhindert den Start NIE — der
# Server schreibt in sein Log, woran es lag, und läuft weiter.
#
# Zusätze: versionen, anhaenge, freigeben, pruefspur, gruppen, sso, ldap,
#          anhangsuche, export, vorlagen, kommentare, konflikte
#
# Ausgestellt wird mit  premium/cmd/schluessel  — siehe backend/premium/README.md
#   Umgebung: NEXORA_LIZENZ
# lizenz = eyJpIjoi....eLYQaJiH...


[Registrierung]

# Darf sich jeder selbst ein Konto anlegen?
#
# Auf "nein" legen nur Admins Konten an. Für eine Firmeninstanz ist das der
# richtige Wert — sonst kann sich jeder, der die Adresse kennt, eintragen.
#
# Achtung beim ersten Start: das ALLERERSTE Konto wird zum Administrator. Steht
# die Registrierung auf "nein", bevor es existiert, kommt niemand hinein.
#   Umgebung: NEXORA_REGISTRIERUNG_OFFEN     Vorgabe: ja
registrierung_offen = ja

# Wenn gesetzt, sind nur Adressen dieser Domänen zugelassen. Komma-getrennt.
# Leer heißt: keine Einschränkung.
#   Umgebung: NEXORA_ERLAUBTE_DOMAENEN     Vorgabe: leer
# erlaubte_domaenen = example.de, tochter.example.de


[Suche]

# Wörterbuch der Volltextsuche.
#
# "german" sucht über Wortformen hinweg — "Rechnungen" findet "Rechnung".
# Bei überwiegend englischen Inhalten "english" nehmen, bei gemischten
# "simple": das stemmt gar nicht und trifft dafür in keiner Sprache daneben.
#
# ACHTUNG: Eine Änderung wirkt erst, wenn der Index neu aufgebaut wird —
# die tsvector-Spalte ist mit dem Wörterbuch erzeugt worden.
#   Umgebung: NEXORA_SUCH_WOERTERBUCH     Vorgabe: german
such_woerterbuch = german


[Anhänge]

# Größte zulässige Datei je Anhang, in Megabyte.
# Der Platz auf der Platte hinter daten_verzeichnis ist die eigentliche Grenze.
#   Umgebung: NEXORA_MAX_ANHANG_MB     Vorgabe: 25
max_anhang_mb = 25


# =============================================================================
#  Objektspeicher (S3)
# =============================================================================
#
#  Wohin die Bytes eines Anhangs gehen. Ohne diesen Abschnitt liegen sie als
#  Dateien im daten_verzeichnis, und das ist für eine einzelne Instanz auch
#  völlig ausreichend.
#
#  Zwei Gründe sprechen für einen Objektspeicher:
#
#    - Sicherung. Anhänge liegen sonst außerhalb der Datenbank, ein Dump allein
#      ist also keine vollständige Sicherung. Der Eimer lässt sich getrennt und
#      versioniert sichern.
#    - Mehrere Instanzen. Zwei Container können sich kein lokales Verzeichnis
#      teilen; einen Eimer schon.
#
#  Die Dateien werden weiterhin DURCH Nexora ausgeliefert, nicht über einen
#  vorsignierten Link. Das ist langsamer und Absicht: ein solcher Link gilt für
#  jeden, der ihn hat, und würde die Rechteprüfung je Seite aushebeln.
#
#  Ist der Speicher beim Start nicht erreichbar, fällt Nexora auf die Platte
#  zurück und sagt es deutlich im Log -- eine laufende Instanz mit lokalen
#  Anhängen ist besser als eine, die gar nicht hochkommt.
# =============================================================================

#   Umgebung: NEXORA_S3_AKTIV     Vorgabe: nein
s3_aktiv = nein

# Adresse OHNE Schema, also host:port. Ein versehentlich eingetragenes
# http:// wird abgeschnitten.
#
# Achtung bei Docker: der Endpunkt muss aus Sicht des Nexora-CONTAINERS
# erreichbar sein. Läuft MinIO in einem anderen Compose-Verbund, ist das die
# Adresse des Wirts mit dem veröffentlichten Port, nicht der Containername.
#   Umgebung: NEXORA_S3_ENDPUNKT
# s3_endpunkt = 10.0.2.43:9010

# Der Eimer wird angelegt, falls er fehlt.
#   Umgebung: NEXORA_S3_BUCKET     Vorgabe: nexora
s3_bucket = nexora

#   Umgebung: NEXORA_S3_ZUGRIFFSSCHLUESSEL / NEXORA_S3_GEHEIMNIS
# s3_zugriffsschluessel = ...
# s3_geheimnis = ...

# Von MinIO und Garage ignoriert, von AWS verlangt.
#   Umgebung: NEXORA_S3_REGION     Vorgabe: us-east-1
s3_region = us-east-1

# HTTPS zum Objektspeicher. Im selben Rechenzentrum verzichtbar, über ein
# fremdes Netz nicht: sonst gehen Zugangsschlüssel und Dateien im Klartext.
#   Umgebung: NEXORA_S3_TLS     Vorgabe: nein
s3_tls = nein

# Pfadstil: http://host/eimer/schluessel statt http://eimer.host/schluessel.
# MinIO und Garage brauchen das, AWS kommt mit beidem zurecht.
#   Umgebung: NEXORA_S3_PFADSTIL     Vorgabe: ja
s3_pfadstil = ja


# =============================================================================
#  LDAP / Active Directory                      (Zusatzumfang: "ldap")
# =============================================================================
#
#  Angemeldet wird gegen das Verzeichnis: Nexora bindet mit den eingegebenen
#  Zugangsdaten, statt ein eigenes Passwort zu prüfen. Ein Konto wird beim
#  ersten erfolgreichen Anmelden angelegt.
#
#  Passwörter aus dem Verzeichnis werden NIE gespeichert — auch nicht als Hash.
#
#  Fällt das Verzeichnis aus, greift die normale Passwortanmeldung weiter. Ein
#  lokales Admin-Konto sollte es deshalb immer geben.
# =============================================================================

#   Umgebung: NEXORA_LDAP_AKTIV     Vorgabe: nein
ldap_aktiv = nein

# Adresse des Verzeichnisses. ldaps:// verschlüsselt von Anfang an,
# ldap:// braucht dann ldap_starttls = ja.
#   Umgebung: NEXORA_LDAP_SERVER
# ldap_server = ldaps://dc01.example.local:636

# Bei ldap:// nach dem Verbinden auf TLS umschalten. Ohne das gehen die
# Zugangsdaten im Klartext über das Netz.
#   Umgebung: NEXORA_LDAP_STARTTLS     Vorgabe: ja
ldap_starttls = ja

# Serverzertifikat prüfen. Auf "nein" nur für einen Test mit selbst
# ausgestelltem Zertifikat — damit ist die Verbindung gegen einen
# zwischengeschalteten Angreifer nicht mehr geschützt.
#   Umgebung: NEXORA_LDAP_TLS_PRUEFEN     Vorgabe: ja
ldap_tls_pruefen = ja

# Dienstkonto, mit dem Nexora Benutzer sucht. Es braucht nur Leserecht.
# Bleibt es leer, wird anonym gesucht, was die meisten Verzeichnisse ablehnen.
#   Umgebung: NEXORA_LDAP_BIND_DN / NEXORA_LDAP_BIND_PASSWORT
# ldap_bind_dn = CN=nexora,OU=Dienstkonten,DC=example,DC=local
# ldap_bind_passwort = geheim

# Ab wo gesucht wird.
#   Umgebung: NEXORA_LDAP_BASIS_DN
# ldap_basis_dn = OU=Benutzer,DC=example,DC=local

# Suchfilter. %s wird durch die Eingabe ersetzt und dabei escaped, damit eine
# Eingabe wie *)(uid=* den Filter nicht aufbrechen kann.
#
# Die Vorgabe erlaubt Anmeldung mit Benutzername, sAMAccountName oder Adresse.
# Reines Active Directory kommt oft mit:
#     (&(objectClass=user)(sAMAccountName=%s))
#   Umgebung: NEXORA_LDAP_BENUTZER_FILTER
ldap_benutzer_filter = (&(objectClass=person)(|(uid=%s)(sAMAccountName=%s)(mail=%s)))

# Aus welchen Feldern Name und Adresse gelesen werden.
# Active Directory: displayName und mail. OpenLDAP: cn und mail.
#   Umgebung: NEXORA_LDAP_FELD_NAME / NEXORA_LDAP_FELD_EMAIL
ldap_feld_name = cn
ldap_feld_email = mail

# Wer in dieser Gruppe ist, wird beim Anmelden zum Administrator. Leer lassen,
# um Rollen ausschließlich in Nexora zu vergeben.
#   Umgebung: NEXORA_LDAP_GRUPPE_ADMIN     Vorgabe: leer
# ldap_gruppe_admin = CN=Nexora-Admins,OU=Gruppen,DC=example,DC=local


# =============================================================================
#  OIDC / Keycloak                               (Zusatzumfang: "sso")
# =============================================================================
#
#  Anmeldung über einen Identitätsanbieter. Ein Konto wird beim ersten
#  erfolgreichen Anmelden angelegt.
#
#  Beim Anbieter als Rücksprungadresse eintragen:
#      <oeffentliche_url>/api/auth/oidc/rueck
# =============================================================================

#   Umgebung: NEXORA_OIDC_AKTIV     Vorgabe: nein
oidc_aktiv = nein

# Aussteller-URL ohne Schrägstrich am Ende. Nexora liest darunter selbst
# /.well-known/openid-configuration und findet die Endpunkte damit allein.
#   Umgebung: NEXORA_OIDC_AUSSTELLER
# oidc_aussteller = http://10.0.2.43:8180/realms/homelab

#   Umgebung: NEXORA_OIDC_CLIENT_ID / NEXORA_OIDC_GEHEIMNIS
# oidc_client_id = nexora
# oidc_geheimnis = ...

# Angeforderte Bereiche. "openid" ist Pflicht.
#   Umgebung: NEXORA_OIDC_BEREICHE     Vorgabe: openid email profile
oidc_bereiche = openid email profile

# Aus welchen Angaben im Token Name und Adresse gelesen werden.
#   Umgebung: NEXORA_OIDC_FELD_NAME / NEXORA_OIDC_FELD_EMAIL
oidc_feld_name = name
oidc_feld_email = email

# Wer diese Gruppe im Token führt, wird Administrator. Setzt voraus, dass der
# Anbieter Gruppen mitschickt — bei Keycloak über einen "groups"-Mapper.
#   Umgebung: NEXORA_OIDC_GRUPPE_ADMIN     Vorgabe: leer
# oidc_gruppe_admin = nexora-admins

# Beschriftung des Anmeldeknopfes.
#   Umgebung: NEXORA_OIDC_KNOPF_TEXT     Vorgabe: Mit SSO anmelden
oidc_knopf_text = Mit Keycloak anmelden
