# Side file: a Postgres belonging to Nexora.
#
# For everybody who does not run their own. Whoever has one leaves this file out
# and sets DATABASE_URL in the .env instead; Nexora creates its schema itself on
# start and needs nothing but an account with rights on an empty database.
#
#     docker compose -f docker-compose.yml -f docker-compose.db.yml up -d
services:
  db:
    image: postgres:16-alpine
    # Encrypted, with the certificate from the PKI container. PostgreSQL
    # otherwise speaks in the clear, and everything goes over this wire: every
    # page, every password hash, every session id.
    command:
      - -c
      - ssl=on
      - -c
      - ssl_cert_file=/pki/db/db.crt
      - -c
      - ssl_key_file=/pki/db/db.key
    environment:
      POSTGRES_USER: nexora
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nexora}
      POSTGRES_DB: nexora
    depends_on:
      pki:
        condition: service_completed_successfully
    volumes:
      - nexora_db:/var/lib/postgresql/data
      - nexora_pki:/pki:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexora"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # Start only once the database really answers. Without that the backend runs
  # into a closed door on the first boot and falls over.
  backend:
    environment:
      # verify-full and not require: "require" does encrypt but does not check
      # with whom -- which would make the encryption a reassurance and not a
      # statement. The check runs against the compound's own authority.
      #
      # Whoever brings their own database sets DATABASE_URL in the .env and
      # leaves this side file out; then whatever stands there applies.
      DATABASE_URL: ${DATABASE_URL:-postgres://nexora:${POSTGRES_PASSWORD:-nexora}@db:5432/nexora?sslmode=verify-full&sslrootcert=/pki/ca.crt}
    depends_on:
      db:
        condition: service_healthy

volumes:
  nexora_db:
