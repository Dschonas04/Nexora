# Side file: a Postgres belonging to Nexora.
#
# For everybody who does not run their own. Whoever has one leaves this file out
# and sets DATABASE_URL in the .env instead; Nexora creates its schema itself on
# start and needs nothing but an account with rights on an empty database.
#
#     docker compose -f docker-compose.yml -f docker-compose.db.yml up -d
services:
  db:
    image: postgres:16-alpine
    # Verschlüsselt, mit dem Zertifikat aus dem PKI-Container. PostgreSQL
    # spricht sonst im Klartext, und über diese Leitung geht alles: jede Seite,
    # jeder Passwort-Hash, jede Sitzungskennung.
    command:
      - -c
      - ssl=on
      - -c
      - ssl_cert_file=/pki/db/db.crt
      - -c
      - ssl_key_file=/pki/db/db.key
    environment:
      POSTGRES_USER: nexora
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nexora}
      POSTGRES_DB: nexora
    depends_on:
      pki:
        condition: service_completed_successfully
    volumes:
      - nexora_db:/var/lib/postgresql/data
      - nexora_pki:/pki:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexora"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # Start only once the database really answers. Without that the backend runs
  # into a closed door on the first boot and falls over.
  backend:
    environment:
      # verify-full und nicht require: "require" verschlüsselt zwar, prüft aber
      # nicht, mit wem -- damit wäre die Verschlüsselung eine Beruhigung und
      # keine Aussage. Geprüft wird gegen die eigene Stelle des Verbunds.
      #
      # Wer eine eigene Datenbank mitbringt, setzt DATABASE_URL in der .env und
      # lässt diese Beidatei weg; dann gilt, was dort steht.
      DATABASE_URL: ${DATABASE_URL:-postgres://nexora:${POSTGRES_PASSWORD:-nexora}@db:5432/nexora?sslmode=verify-full&sslrootcert=/pki/ca.crt}
    depends_on:
      db:
        condition: service_healthy

volumes:
  nexora_db:
