# Side file: a Postgres belonging to Nexora.
#
# For everybody who does not run their own. Whoever has one leaves this file out
# and sets DATABASE_URL in the .env instead; Nexora creates its schema itself on
# start and needs nothing but an account with rights on an empty database.
#
#     docker compose -f docker-compose.yml -f docker-compose.db.yml up -d
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: nexora
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nexora}
      POSTGRES_DB: nexora
    volumes:
      - nexora_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexora"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # Start only once the database really answers. Without that the backend runs
  # into a closed door on the first boot and falls over.
  backend:
    depends_on:
      db:
        condition: service_healthy

volumes:
  nexora_db:
