# Nexora fuer Umbrel.
#
# Umbrel setzt den app_proxy davor und fuellt APP_PASSWORD und APP_SEED selbst,
# deshalb muss hier nichts von Hand erzeugt werden. Die Daten liegen unter
# ${APP_DATA_DIR}, damit Umbrels Sicherung sie mitnimmt.
version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: nexora_frontend_1
      APP_PORT: 80

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: nexora
      POSTGRES_USER: nexora
      POSTGRES_PASSWORD: ${APP_PASSWORD}
    volumes:
      - ${APP_DATA_DIR}/data/db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexora -d nexora"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: on-failure

  pki:
    image: ghcr.io/dschonas04/nexora-pki:2.2.0
    volumes:
      - ${APP_DATA_DIR}/data/pki:/pki
    restart: "no"

  backend:
    image: ghcr.io/dschonas04/nexora-backend:2.2.0
    # Asks /healthz, which also pings the database. Written with the shell and
    # wget so it works on every image, including those from before the binary
    # learnt "nexora healthcheck".
    healthcheck:
      test: ["CMD-SHELL", "[ -n \"$$NEXORA_TLS_CERTIFICATE\" ] && s=https || s=http; wget -q -O /dev/null --no-check-certificate $$s://127.0.0.1:$${PORT:-8080}/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on:
      db:
        condition: service_healthy
      pki:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgres://nexora:${APP_PASSWORD}@db:5432/nexora?sslmode=disable
      JWT_SECRET: ${APP_SEED}
      PORT: "8443"
      NEXORA_TLS_CERTIFICATE: /pki/backend/backend.crt
      NEXORA_TLS_KEY: /pki/backend/backend.key
      NEXORA_TLS_ROOT: /pki/ca.crt
      NEXORA_ATTACHMENT_PATH: /data/attachments
    volumes:
      - ${APP_DATA_DIR}/data/anhaenge:/data/attachments
      - ${APP_DATA_DIR}/data/pki:/pki:ro
    restart: on-failure

  frontend:
    image: ghcr.io/dschonas04/nexora-frontend:2.2.0
    # Only that nginx answers; whether the service behind it does is the
    # backend's own check.
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    depends_on:
      pki:
        condition: service_completed_successfully
      backend:
        condition: service_healthy
    environment:
      NEXORA_SERVICE_SCHEME: https
      NEXORA_SERVICE_PORT: "8443"
    volumes:
      - ${APP_DATA_DIR}/data/tls:/etc/nginx/tls
      - ${APP_DATA_DIR}/data/pki:/pki:ro
    restart: on-failure
