apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: nexora-backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nexora-backend
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: backend
          image: ghcr.io/dschonas04/nexora-backend
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - secretRef:
                name: nexora
          env:
            - name: PORT
              value: "8080"
            - name: NEXORA_ATTACHMENT_PATH
              value: /data/attachments
          volumeMounts:
            - name: attachments
              mountPath: /data/attachments
          # /healthz pings the database as well; while it fails, the pod
          # takes no traffic, and after a minute of failing it is restarted.
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
      volumes:
        - name: attachments
          persistentVolumeClaim:
            claimName: nexora-attachments
---
# Named "backend" on purpose: the frontend's nginx looks for the service under
# exactly that name.
apiVersion: v1
kind: Service
metadata:
  name: backend
spec:
  selector:
    app.kubernetes.io/name: nexora-backend
  ports:
    - name: http
      port: 8080
      targetPort: http
