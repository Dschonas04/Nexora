services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: nexora
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nexora}
      POSTGRES_DB: nexora
    volumes:
      - nexora_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexora"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgres://nexora:${POSTGRES_PASSWORD:-nexora}@db:5432/nexora?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      PORT: "8080"
      NEXORA_DATA_DIR: /data/attachments
      # Schaltet die kostenpflichtigen Zusätze frei. Leer lassen heißt: Nexora
      # läuft mit dem freien Umfang, gesperrte Aufrufe antworten mit 402.
      NEXORA_LIZENZ: ${NEXORA_LIZENZ:-}
    volumes:
      - nexora_files:/data/attachments
      # Die Konfiguration wird nur gelesen, deshalb schreibgeschützt. Fehlt die
      # Datei, startet Nexora trotzdem -- dann gelten Vorgaben und die
      # Umgebungsvariablen unten.
      - ./config.conf:/etc/nexora/config.conf:ro
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "${PORT:-3000}:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  nexora_db:
  nexora_files:
