# Nexora itself: backend and interface.
#
# The database and the object store are deliberately NOT here. Both are services
# one often already has in place, a maintained Postgres, a MinIO for everything
# in the house. Chaining them to Nexora would mean running them twice or not
# being able to take Nexora at all.
#
# Whoever does not have them adds the side files:
#
#     docker compose -f docker-compose.yml -f docker-compose.db.yml up -d
#     docker compose -f docker-compose.yml -f docker-compose.db.yml \
#                    -f docker-compose.minio.yml up -d
#
# So that this need not be typed on every call, the same list is entered once as
# COMPOSE_FILE in the .env, see .env.example.
#
services:
  backend:
    build: ./backend
    environment:
      # The database can be the one shipped along or an outside one. The default
      # points at the service from docker-compose.db.yml; whoever runs their own
      # sets DATABASE_URL in the .env and leaves the side file out.
      DATABASE_URL: ${DATABASE_URL:-postgres://nexora:${POSTGRES_PASSWORD:-nexora}@db:5432/nexora?sslmode=disable}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      PORT: "8080"
      NEXORA_DATA_DIR: /data/attachments
      # Unlocks the paid extras. Leaving it empty means: Nexora runs with the
      # free scope, and locked calls answer with 402.
      NEXORA_LIZENZ: ${NEXORA_LIZENZ:-}
      # Object store. Leaving it empty means: attachments stay on disk. The
      # endpoint has to be reachable from THIS container's point of view; if
      # MinIO runs in another compose project, that is the host's address with
      # the published port, not the container name.
      NEXORA_S3_AKTIV: ${NEXORA_S3_AKTIV:-}
      NEXORA_S3_ENDPUNKT: ${NEXORA_S3_ENDPUNKT:-}
      NEXORA_S3_BUCKET: ${NEXORA_S3_BUCKET:-}
      NEXORA_S3_ZUGRIFFSSCHLUESSEL: ${NEXORA_S3_ZUGRIFFSSCHLUESSEL:-}
      NEXORA_S3_GEHEIMNIS: ${NEXORA_S3_GEHEIMNIS:-}
      NEXORA_S3_REGION: ${NEXORA_S3_REGION:-}
      NEXORA_S3_TLS: ${NEXORA_S3_TLS:-}
      NEXORA_S3_PFADSTIL: ${NEXORA_S3_PFADSTIL:-}
    volumes:
      - nexora_files:/data/attachments
      # This file does NOT lie in the directory, it is copied once from the
      # template:
      #
      #     cp config.beispiel.conf config.conf
      #
      # Reason: it holds credentials and is edited on the maintenance page. A
      # tracked version would be written over on every rollout, and because a
      # bind mount hangs on the inode, host and container saw two different
      # files afterwards.
      #
      # If it is missing Nexora still starts, and then the defaults and the
      # environment variables above apply.
      #
      # Mounted writable so that the maintenance page can change the file. For
      # that to take effect the file also has to belong to the service, which
      # runs in the container as uid/gid 10001:
      #
      #     sudo chgrp 10001 config.conf && sudo chmod 660 config.conf
      #
      # Without this step the maintenance page shows the file and says that it
      # is read only. Whoever wants it that way appends a :ro as well.
      - ./config.conf:/etc/nexora/config.conf
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "${PORT:-3000}:80"
      # The same service, encrypted. The container issues the certificate itself
      # on the first start and puts it into the volume so that it survives a
      # rebuild; a certificate changing on every rollout produces a new warning
      # every time.
      - "${PORT_TLS:-3443}:443"
    environment:
      # Stands in the certificate as its name. Without it, the container's host
      # name is used, which leads to a second warning in the browser.
      NEXORA_TLS_NAME: ${NEXORA_TLS_NAME:-nexora}
      NEXORA_TLS_IP: ${NEXORA_TLS_IP:-}
    volumes:
      - nexora_tls:/etc/nginx/tls
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  nexora_tls:
  # Only the attachments on disk. The database's volume belongs to the side file
  # that brings it along.
  nexora_files:
