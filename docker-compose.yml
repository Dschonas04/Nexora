# Nexora selbst: Backend und Oberfläche.
#
# Datenbank und Objektspeicher stehen absichtlich NICHT hier. Beides sind
# Dienste, die man im Bestand oft schon hat, eine gepflegte Postgres, ein
# MinIO für alles im Haus. Sie fest an Nexora zu ketten hieße, sie doppelt zu
# betreiben oder Nexora nicht nehmen zu können.
#
# Wer sie nicht hat, legt die Beilagen dazu:
#
#     docker compose -f docker-compose.yml -f docker-compose.db.yml up -d
#     docker compose -f docker-compose.yml -f docker-compose.db.yml \
#                    -f docker-compose.minio.yml up -d
#
# Damit man das nicht bei jedem Aufruf tippt, trägt man dieselbe Liste einmal
# als COMPOSE_FILE in die .env ein, siehe .env.example.
#
services:
  backend:
    build: ./backend
    environment:
      # Die Datenbank kann mitgeliefert oder fremd sein. Die Vorgabe zeigt auf
      # den Dienst aus docker-compose.db.yml; wer eine eigene betreibt, setzt
      # DATABASE_URL in der .env und lässt die Beilage weg.
      DATABASE_URL: ${DATABASE_URL:-postgres://nexora:${POSTGRES_PASSWORD:-nexora}@db:5432/nexora?sslmode=disable}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      PORT: "8080"
      NEXORA_DATA_DIR: /data/attachments
      # Schaltet die kostenpflichtigen Zusätze frei. Leer lassen heißt: Nexora
      # läuft mit dem freien Umfang, gesperrte Aufrufe antworten mit 402.
      NEXORA_LIZENZ: ${NEXORA_LIZENZ:-}
      # Objektspeicher. Leer lassen heißt: Anhänge bleiben auf der Platte.
      # Der Endpunkt muss aus Sicht DIESES Containers erreichbar sein, läuft
      # MinIO in einem anderen Compose-Verbund, ist das die Adresse des Wirts
      # mit dem veröffentlichten Port, nicht der Containername.
      NEXORA_S3_AKTIV: ${NEXORA_S3_AKTIV:-}
      NEXORA_S3_ENDPUNKT: ${NEXORA_S3_ENDPUNKT:-}
      NEXORA_S3_BUCKET: ${NEXORA_S3_BUCKET:-}
      NEXORA_S3_ZUGRIFFSSCHLUESSEL: ${NEXORA_S3_ZUGRIFFSSCHLUESSEL:-}
      NEXORA_S3_GEHEIMNIS: ${NEXORA_S3_GEHEIMNIS:-}
      NEXORA_S3_REGION: ${NEXORA_S3_REGION:-}
      NEXORA_S3_TLS: ${NEXORA_S3_TLS:-}
      NEXORA_S3_PFADSTIL: ${NEXORA_S3_PFADSTIL:-}
    volumes:
      - nexora_files:/data/attachments
      # Diese Datei liegt NICHT im Verzeichnis, sie wird einmal aus der
      # Vorlage kopiert:
      #
      #     cp config.beispiel.conf config.conf
      #
      # Grund: sie enthaelt Zugangsdaten und wird auf der Wartungsseite
      # bearbeitet. Ein verfolgter Stand wuerde bei jedem Ausrollen darueber
      # hinweggeschrieben, und weil eine Einbindung am Inode haengt, sahen
      # Wirt und Container danach zwei verschiedene Dateien.
      #
      # Fehlt sie, startet Nexora trotzdem, dann gelten Vorgaben und die
      # Umgebungsvariablen oben.
      #
      # Beschreibbar eingehängt, damit die Wartungsseite die Datei ändern kann.
      # Damit das wirkt, muss die Datei auch dem Dienst gehören, er läuft im
      # Container als uid/gid 10001:
      #
      #     sudo chgrp 10001 config.conf && sudo chmod 660 config.conf
      #
      # Ohne diesen Schritt zeigt die Wartungsseite die Datei an und sagt, dass
      # sie nur lesbar ist. Wer das so will, hängt zusätzlich ein :ro an.
      - ./config.conf:/etc/nexora/config.conf
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "${PORT:-3000}:80"
      # Derselbe Dienst verschlüsselt. Das Zertifikat stellt der Container beim
      # ersten Start selbst aus und legt es in den Datenträger, damit es einen
      # Neubau überlebt, ein Zertifikat, das sich bei jedem Ausrollen ändert,
      # erzeugt jedes Mal eine neue Warnung.
      - "${PORT_TLS:-3443}:443"
    environment:
      # Steht im Zertifikat als Name. Ohne Angabe der Rechnername des
      # Containers, was im Browser zu einer zweiten Warnung führt.
      NEXORA_TLS_NAME: ${NEXORA_TLS_NAME:-nexora}
      NEXORA_TLS_IP: ${NEXORA_TLS_IP:-}
    volumes:
      - nexora_tls:/etc/nginx/tls
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  nexora_tls:
  # Nur die Anhänge auf der Platte. Der Datenträger der Datenbank gehört zur
  # Beilage, die sie mitbringt.
  nexora_files:
