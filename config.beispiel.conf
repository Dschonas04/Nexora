# =============================================================================
#  Nexora — configuration
# =============================================================================
#
#  This file is entirely optional. Every setting has a default that adds up to
#  a working server — without a config.conf Nexora starts all the same.
#
#  PRECEDENCE, highest first:
#
#      1. environment variable
#      2. entry in this file
#      3. built-in default
#
#  The environment beats the file on purpose: that way a single value can be
#  overridden inside a container without rebuilding the image, and a secret
#  never has to touch the disk. The name of the environment variable stands
#  with every entry.
#
#  WHERE IT IS LOOKED FOR, in this order:
#      $NEXORA_CONFIG   →   ./config.conf   →   /etc/nexora/config.conf
#
#  FORMAT:
#      key = value               one entry per line
#      # or ;                    starts a comment
#      [Section]                 for structure only, it is skipped
#      "  value with space  "    quotes keep leading and trailing spaces
#
#  Yes/no values understood: ja nein, true false, an aus, 1 0, yes no, on off
#
#  SECRETS: this file lies in the repository and therefore holds nothing but
#  defaults and examples. Real passwords, license keys and the JWT secret
#  belong either
#
#      a) in environment variables (they beat the file, see precedence), or
#      b) in a copy of your own outside the repository, named through
#         NEXORA_CONFIG — and then chmod 600.
#
#  The keys are German, as is everything else in this code base. They are not
#  translated here: a key is a name, and a name that reads differently in the
#  documentation than in the program is worse than one in a foreign language.
#
# =============================================================================


[Server]

# Port the API listens on. Inside the compose stack only the frontend talks to
# it; what faces outward is port 3000 of the nginx.
#   Environment: PORT     Default: 8080
port = 8080

# Working directory of the service. What lands in it besides the attachments is
# little: backups of this file, for instance. Has to be a persistent volume —
# inside the container's file system it is gone after every rebuild.
#   Environment: NEXORA_DATA_DIR     Default: /data/attachments
daten_verzeichnis = /data/attachments

# Directory for the uploaded attachments. Empty means: the same one as above.
#
# The attachments are the only part that grows without bound, so they are worth
# a place of their own — a disk, a share, a mount of the file server. In the
# compose stack the counterpart is NEXORA_ANHANG_ORT in the .env, which decides
# what is mounted onto this path.
#
# Moving it does NOT move the files. Whoever changes the directory carries the
# existing files over themselves, or Nexora looks for them in the new place and
# does not find them.
#   Environment: NEXORA_ANHANG_PFAD     Default: empty (daten_verzeichnis)
# anhang_verzeichnis = /data/anhaenge

# The absolute address Nexora is reachable at from outside, without a trailing
# slash. Needed for the return address with OIDC and nowhere else. Leave it
# empty as long as OIDC is off.
#   Environment: NEXORA_PUBLIC_URL     Default: empty
# oeffentliche_url = https://wiki.example.de


[Database]

# Connection to the PostgreSQL database. The schema is applied on every start
# and is repeatable — a fresh database and an existing one end up at the same
# state.
#
# ATTENTION: holds the password. That is why this file goes to chmod 600.
# Alternatively use the environment variable and leave the entry out here.
#   Environment: DATABASE_URL
datenbank_url = postgres://nexora:nexora@db:5432/nexora?sslmode=disable


[Sessions]

# Secret the session tokens are signed with.
#
# CHANGE THIS. Whoever knows it can pose as any user.
# Generate with:   openssl rand -hex 32
#
# Changing it signs everybody out — that is the quickest way to invalidate
# every session when something has gone astray.
#   Environment: JWT_SECRET
jwt_geheimnis = change-me-in-production

# How long a sign-in is valid. A session that is being used renews itself as
# soon as half the time has passed. Whoever works daily is therefore not signed
# out; whoever stays away is. Shorter is safer, longer is more convenient.
#
# The earlier figures in days (sitzung_tage) are still read and converted, so
# that an existing file does not silently become shorter.
#   Environment: NEXORA_SESSION_HOURS     Default: 12
sitzung_stunden = 12


[License]

# License key for the paid extras.
#
# Without a key Nexora runs with the free scope; locked calls answer with 402.
# A broken key NEVER prevents the start — the server writes what was wrong with
# it into its log and carries on.
#
# Extras: versionen, anhaenge, freigeben, pruefspur, gruppen, sso, ldap,
#         anhangsuche, export, kommentare, konflikte
#
# Issued with  premium/cmd/schluessel  — see backend/premium/README.md
#   Environment: NEXORA_LIZENZ
# lizenz = eyJpIjoi....eLYQaJiH...


[Registration]

# May anybody create an account for themselves?
#
# On "nein" only admins create accounts. For a company instance that is the
# right value — otherwise anyone who knows the address can sign themselves up.
#
# Careful on the first start: the VERY FIRST account becomes the administrator.
# If registration stands on "nein" before it exists, nobody gets in.
#   Environment: NEXORA_REGISTRIERUNG_OFFEN     Default: ja
registrierung_offen = ja

# When set, only addresses of these domains are allowed. Comma separated.
# Empty means: no restriction.
#   Environment: NEXORA_ERLAUBTE_DOMAENEN     Default: empty
# erlaubte_domaenen = example.de, tochter.example.de


[Search]

# Dictionary of the full text search.
#
# "german" searches across word forms — "Rechnungen" finds "Rechnung". With
# mostly English content take "english", with mixed content "simple": that does
# no stemming at all and in return misses in no language.
#
# ATTENTION: a change only takes effect once the index is rebuilt — the tsvector
# column was created with the dictionary.
#   Environment: NEXORA_SUCH_WOERTERBUCH     Default: german
such_woerterbuch = german


[Attachments]

# Largest file allowed per attachment, in megabytes.
# The space behind anhang_verzeichnis, or the bucket, is the real limit.
#   Environment: NEXORA_MAX_ANHANG_MB     Default: 25
max_anhang_mb = 25


[Trash]

# After how many days in the trash a page disappears for good.
#
# 0 means: never by itself. Every deleted page then lies there until an
# administrator empties the trash — which makes the trash a second collection
# of everything ever deleted, including what was deleted because it was not to
# be kept.
#
# The sweep runs hourly. Subpages, versions, comments and the files of the
# attachments go with it.
#   Environment: NEXORA_PAPIERKORB_TAGE     Default: 30
papierkorb_tage = 30


# =============================================================================
#  Object store (S3)
# =============================================================================
#
#  Where the bytes of an attachment go. Without this section they lie as files
#  in anhang_verzeichnis, and for a single instance that is perfectly enough.
#
#  Two things speak for an object store:
#
#    - Backups. Attachments otherwise lie outside the database, so a dump alone
#      is not a complete backup. A bucket can be backed up separately and with
#      versions.
#    - Several instances. Two containers cannot share a local directory; a
#      bucket they can.
#
#  The files are still served THROUGH Nexora, not over a presigned link. That
#  is slower and deliberate: such a link holds for anybody who has it and would
#  bypass the per-page permission check.
#
#  If the store cannot be reached at startup, Nexora does NOT come up. That is
#  deliberate: falling back to the disk sounds friendlier than it is, because
#  the instance runs, uploads work, and only much later does anybody notice that
#  part of the attachments lies in a directory nobody backs up. Whoever wants
#  the disk as a stopgap anyway sets s3_rueckfall.
# =============================================================================

#   Environment: NEXORA_S3_AKTIV     Default: nein
s3_aktiv = nein

# Address WITHOUT the scheme, so host:port. An http:// entered by accident is
# cut off.
#
# Careful with Docker: the endpoint has to be reachable from the point of view
# of the Nexora CONTAINER. If MinIO runs in another compose stack, that is the
# host's address with the published port, not the container name.
#   Environment: NEXORA_S3_ENDPUNKT
# s3_endpunkt = 10.0.2.43:9010

# The bucket is created if it is missing.
#   Environment: NEXORA_S3_BUCKET     Default: nexora
s3_bucket = nexora

#   Environment: NEXORA_S3_ZUGRIFFSSCHLUESSEL / NEXORA_S3_GEHEIMNIS
# s3_zugriffsschluessel = ...
# s3_geheimnis = ...

# Ignored by MinIO and Garage, demanded by AWS.
#   Environment: NEXORA_S3_REGION     Default: us-east-1
s3_region = us-east-1

# HTTPS to the object store. Dispensable within the same data centre, not over
# a foreign network: otherwise access keys and files travel in the clear.
#   Environment: NEXORA_S3_TLS     Default: nein
s3_tls = nein

# Path style: http://host/bucket/key instead of http://bucket.host/key.
# MinIO and Garage need it, AWS copes with both.
#   Environment: NEXORA_S3_PFADSTIL     Default: ja
s3_pfadstil = ja

# Whether the disk may stand in when the store does not answer at startup.
# ja: Nexora comes up and writes new attachments into anhang_verzeichnis, with a
# clear note in the log. nein: Nexora refuses to start, so the attachments stay
# in one place.
#   Environment: NEXORA_S3_RUECKFALL     Default: nein
s3_rueckfall = nein


# =============================================================================
#  LDAP / Active Directory                            (paid extra: "ldap")
# =============================================================================
#
#  Signing in goes against the directory: Nexora binds with the credentials
#  entered instead of checking a password of its own. An account is created on
#  the first successful sign-in.
#
#  Passwords from the directory are NEVER stored — not even as a hash.
#
#  If the directory fails, the ordinary password sign-in keeps working. There
#  should therefore always be one local admin account.
# =============================================================================

#   Environment: NEXORA_LDAP_AKTIV     Default: nein
ldap_aktiv = nein

# Address of the directory. ldaps:// encrypts from the start,
# ldap:// then needs ldap_starttls = ja.
#   Environment: NEXORA_LDAP_SERVER
# ldap_server = ldaps://dc01.example.local:636

# With ldap://, switch to TLS after connecting. Without it the credentials go
# over the network in the clear.
#   Environment: NEXORA_LDAP_STARTTLS     Default: ja
ldap_starttls = ja

# Check the server certificate. Set to "nein" only for a test with a
# self-signed certificate — the connection is then no longer protected against
# somebody sitting in the middle.
#   Environment: NEXORA_LDAP_TLS_PRUEFEN     Default: ja
ldap_tls_pruefen = ja

# The service account Nexora searches users with. It only needs read access.
# Left empty the search is anonymous, which most directories refuse.
#   Environment: NEXORA_LDAP_BIND_DN / NEXORA_LDAP_BIND_PASSWORT
# ldap_bind_dn = CN=nexora,OU=Dienstkonten,DC=example,DC=local
# ldap_bind_passwort = geheim

# Where the search starts.
#   Environment: NEXORA_LDAP_BASIS_DN
# ldap_basis_dn = OU=Benutzer,DC=example,DC=local

# Search filter. %s is replaced by the input and escaped in the process, so
# that an input like *)(uid=* cannot break the filter open.
#
# The default allows signing in with a user name, sAMAccountName or address.
# Plain Active Directory often does with:
#     (&(objectClass=user)(sAMAccountName=%s))
#   Environment: NEXORA_LDAP_BENUTZER_FILTER
ldap_benutzer_filter = (&(objectClass=person)(|(uid=%s)(sAMAccountName=%s)(mail=%s)))

# Which fields name and address are read from.
# Active Directory: displayName and mail. OpenLDAP: cn and mail.
#   Environment: NEXORA_LDAP_FELD_NAME / NEXORA_LDAP_FELD_EMAIL
ldap_feld_name = cn
ldap_feld_email = mail

# Whoever is in this group becomes an administrator on sign-in. Leave it empty
# to hand out roles exclusively inside Nexora.
#   Environment: NEXORA_LDAP_GRUPPE_ADMIN     Default: empty
# ldap_gruppe_admin = CN=Nexora-Admins,OU=Gruppen,DC=example,DC=local


# =============================================================================
#  OIDC / Keycloak                                     (paid extra: "sso")
# =============================================================================
#
#  Signing in through an identity provider. An account is created on the first
#  successful sign-in.
#
#  Enter as the return address at the provider:
#      <oeffentliche_url>/api/auth/oidc/rueck
# =============================================================================

#   Environment: NEXORA_OIDC_AKTIV     Default: nein
oidc_aktiv = nein

# Issuer URL without a trailing slash. Nexora reads
# /.well-known/openid-configuration underneath it and finds the endpoints on
# its own.
#   Environment: NEXORA_OIDC_AUSSTELLER
# oidc_aussteller = http://10.0.2.43:8180/realms/homelab

#   Environment: NEXORA_OIDC_CLIENT_ID / NEXORA_OIDC_GEHEIMNIS
# oidc_client_id = nexora
# oidc_geheimnis = ...

# Requested scopes. "openid" is mandatory.
#   Environment: NEXORA_OIDC_BEREICHE     Default: openid email profile
oidc_bereiche = openid email profile

# Which claims in the token name and address are read from.
#   Environment: NEXORA_OIDC_FELD_NAME / NEXORA_OIDC_FELD_EMAIL
oidc_feld_name = name
oidc_feld_email = email

# Whoever carries this group in the token becomes an administrator. This
# requires the provider to send groups along — with Keycloak through a "groups"
# mapper.
#   Environment: NEXORA_OIDC_GRUPPE_ADMIN     Default: empty
# oidc_gruppe_admin = nexora-admins

# Caption of the sign-in button.
#   Environment: NEXORA_OIDC_KNOPF_TEXT     Default: Mit SSO anmelden
oidc_knopf_text = Mit Keycloak anmelden


# Redis (optional)

#
# Redis is a cache here, not a store. Everything in it also stands in the
# database, the sessions for instance. If Redis fails, Nexora carries on
# completely, only with one query more per request.
#
# That is exactly why the widespread build "sessions in Redis" is not what
# stands here: there, restarting the cache means everybody is signed out.
#
# Leaving it empty means: without Redis.
# NEXORA_REDIS_ADRESSE
redis_adresse =

# NEXORA_REDIS_PASSWORT
redis_passwort =

# Which of the numbered databases. Default 0.
# NEXORA_REDIS_DATENBANK
redis_datenbank = 0

# Prefix in front of every key, so that two instances can share one Redis
# without overwriting each other's entries.
# NEXORA_REDIS_VORSILBE
redis_vorsilbe = nexora
