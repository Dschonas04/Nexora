version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
  - package-ecosystem: gomod
    directory: /backend
    schedule:
      interval: monthly
  - package-ecosystem: npm
    directories: [/frontend, /packaging/desktop, /packaging/mobile]
    schedule:
      interval: monthly
    groups:
      npm:
        patterns: ["*"]
  - package-ecosystem: docker
    directories: [/backend, /frontend, /pki]
    schedule:
      interval: monthly
