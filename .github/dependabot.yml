version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
  - package-ecosystem: gomod
    directory: /backend
    schedule:
      interval: monthly
  - package-ecosystem: npm
    directories: [/frontend, /packaging/desktop, /packaging/mobile]
    schedule:
      interval: monthly
    groups:
      npm:
        patterns: ["*"]
    ignore:
      # Capacitor 8 needs the Android and iOS projects migrated first.
      - dependency-name: "@capacitor/*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: docker
    directories: [/backend, /frontend, /pki]
    schedule:
      interval: monthly
