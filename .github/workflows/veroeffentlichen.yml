# Build the images and publish them, so that installing does not mean building.
#
# Runs on GitHub's own runners, NOT on the self hosted one: the only thing this
# needs is a Docker daemon and the registry, and the self hosted runner has no
# Docker socket on purpose (see pruefen.yml). The images go to the GitHub
# registry of this repository, which needs no account of its own.
#
# A tag v1.2.3 publishes 1.2.3, 1.2 and latest. The manual run publishes
# whatever main currently is as "edge" -- a moving image nobody has to install,
# but which can be tried without waiting for a release.
name: Abbilder veröffentlichen

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: veroeffentlichen-${{ github.ref }}
  cancel-in-progress: false

jobs:
  abbilder:
    name: ${{ matrix.dienst }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        dienst: [backend, frontend, pki]

    steps:
      - name: Quellen holen
        uses: actions/checkout@v4

      # Zwei Architekturen: amd64 fuer die Server, arm64 fuer die Raspberry Pis
      # und die Macs. Ohne QEMU baut der Laeufer nur seine eigene.
      - name: QEMU einrichten
        uses: docker/setup-qemu-action@v3

      - name: Buildx einrichten
        uses: docker/setup-buildx-action@v3

      - name: An der Registrierung anmelden
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Namen und Marken bestimmen
        id: marken
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/nexora-${{ matrix.dienst }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=edge,enable=${{ github.event_name == 'workflow_dispatch' }}

      - name: Bauen und schieben
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.dienst }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.marken.outputs.tags }}
          labels: ${{ steps.marken.outputs.labels }}
          # Der Zwischenspeicher liegt in derselben Registrierung: ein Release
          # baut sonst jedes Mal die ganze Abhaengigkeitskette neu.
          cache-from: type=registry,ref=ghcr.io/${{ github.repository_owner }}/nexora-${{ matrix.dienst }}:buildcache
          cache-to: type=registry,ref=ghcr.io/${{ github.repository_owner }}/nexora-${{ matrix.dienst }}:buildcache,mode=max
