# The project page. It used to live on a gh-pages branch; the repository has one
# branch now, so the page is built from site/ and published by GitHub itself.
name: Project page

on:
  push:
    branches: [main]
    paths: ['site/**', '.github/workflows/seite.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time, and a running one is allowed to finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  veroeffentlichen:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.ausrollen.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # The pictures live once, in docs/bilder, and are copied into the artifact
      # rather than kept a second time under site/.
      - run: cp -r docs/bilder site/bilder
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: ausrollen
        uses: actions/deploy-pages@v4
