# Keeps the pages on Docker Hub in step with dockerhub/*.md: the short line in
# the list and the long description on each image's page. Docker Hub does not
# read the README from the repository by itself.
name: Docker Hub descriptions

on:
  push:
    branches: [main]
    paths: ['dockerhub/**', '.github/workflows/dockerhub-description.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  describe:
    name: ${{ matrix.image }}
    runs-on: ubuntu-latest
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: single
            short: Self-hosted wiki with backlinks and a knowledge graph, database included, in one container.
          - image: backend
            short: Nexora wiki, Go API service with nexora-frontend + PostgreSQL; `nexora pki` issues internal TLS.
          - image: pki
            short: "DEPRECATED since 3.2.0: certificates now come from nexora-backend (`nexora pki`). Last: 3.1.2."
          - image: frontend
            short: Nexora self-hosted wiki, web interface (nginx + React). Runs with nexora-backend.
    steps:
      - uses: actions/checkout@v7
      - name: Lowercase the account
        run: echo "HUB_USER=${DOCKERHUB_USERNAME,,}" >> "$GITHUB_ENV"
      - uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ env.HUB_USER }}/nexora-${{ matrix.image }}
          short-description: ${{ matrix.short }}
          readme-filepath: dockerhub/${{ matrix.image }}.md
