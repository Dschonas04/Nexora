# Check and, when everything is green, roll out.
#
# Runs on the self hosted runner in the home network, the only one that reaches
# the Docker host this instance runs on. GitHub's own runners have no way there.
#
# ATTENTION, this is the reason for several things here: this repository is
# PUBLIC. A self hosted runner executes what stands in the workflow, and a
# contribution from outside could bring the workflow along. Therefore:
#
#   * NO pull_request trigger. Only what already lies in the repository is
#     built, and only somebody with write access may create branches.
#   * The runner has NO Docker socket of the host (unlike the runners of the
#     private repositories). Building and checking happen in the runner itself.
#   * The key for the rollout is pinned to exactly one command at the target: it
#     can roll out the state of origin/main and nothing else.
name: Check and roll out

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  # Two runs on the same instance would be a race for the same Docker compound.
  # The newer one wins.
  group: nexora
  cancel-in-progress: true

jobs:

  backend:
    name: Backend
    runs-on: [self-hosted, homelab, nexora]
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Print versions
        run: go version

      - name: Formatting
        run: |
          # gofmt reports deviations only by printing file names, so an empty
          # output stream is the pass. metriken.go is generated and was never
          # formatted; it stays out.
          unformatted=$(gofmt -l . | grep -v 'internal/dok/metriken.go' || true)
          if [ -n "$unformatted" ]; then
            echo "Not formatted with gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: Tests
        run: go test ./...

      - name: Compile
        run: go build ./...

      - name: Smoke test against a real database
        run: |
          # The checks above touch no database. That is exactly where the errors
          # sit that one only sees in operation.
          ./test/smoketest.sh

  frontend:
    name: Frontend
    runs-on: [self-hosted, homelab, nexora]
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Print versions
        run: node --version && npm --version

      - name: Install dependencies
        # npm ci and not npm install: exactly what stands in package-lock.json
        # shall be built, and not whatever happens to be new today.
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit -p .

      - name: Build
        run: npm run build

      - name: Editing together, two browsers against each other
        run: |
          # The type check says nothing about whether two versions of the same
          # text really find each other. The probe puts two wires on the same
          # distributor and lets them type at the same spot at the same time.
          npx esbuild test/entry.ts --bundle --format=esm \
            --outfile="$RUNNER_TEMP/mitschrift.mjs" --log-level=warning
          node test/collab-check.mjs "$RUNNER_TEMP/mitschrift.mjs"

      - name: Do the editor's input rules still fire
        run: |
          # Whether "**bold**" turns into bold text while typing is decided by
          # ProseMirror at runtime, not by any type check. The probe stands in
          # for a browser, hangs a real editor inside it and types character by
          # character. A release of BlockNote can change these rules without a
          # single signature moving.
          npx esbuild test/editor-check-entry.ts --bundle --format=esm \
            --conditions=style --loader:.css=empty \
            --outfile="$RUNNER_TEMP/editor.mjs" --log-level=warning
          node test/editor-check.mjs "$RUNNER_TEMP/editor.mjs"

      - name: Marks in a PDF file
        run: |
          # Whether a highlight lands in the right place is decided by a
          # conversion: the PDF counts from the bottom, the screen from the top.
          # The probe writes a file, reads it back and checks that the
          # annotations hang where they should -- and that the existing content
          # was ADDED TO and not replaced.
          npx esbuild src/pdfmarken.ts --bundle --format=esm \
            --outfile="$RUNNER_TEMP/pdfmarken.mjs" --log-level=warning
          node test/pdf-check.mjs "$RUNNER_TEMP/pdfmarken.mjs"

      - name: Colours readable on any ground
        run: |
          # The accent chosen per account must stay readable as text on light
          # and dark ground; the arithmetic for that lives in src/farbe.ts.
          npx esbuild test/colour-check.ts --bundle --format=esm --platform=node \
            --outfile="$RUNNER_TEMP/farbe.mjs" --log-level=warning
          node "$RUNNER_TEMP/farbe.mjs"

      - name: German and English
        run: |
          # The interface is translated at runtime from a pair list. The probe
          # checks lookups and patterns in both directions and that every pair
          # uses the same placeholders on both sides.
          npx esbuild test/language-check.ts --bundle --format=esm --platform=node \
            --outfile="$RUNNER_TEMP/sprache.mjs" --log-level=warning
          node "$RUNNER_TEMP/sprache.mjs"

      - name: Every text in both languages
        run: |
          # Every interface text needs a German/English pair, otherwise it
          # silently stays in one language. Texts that are not prose (names,
          # technical terms) are listed in test/texts-exceptions.txt.
          node test/texts-check.cjs

      - name: The licence notice has to be in the bundle
        run: |
          # BlockNote is under MPL-2.0, and that demands the notice accompany
          # the DISTRIBUTED form. What is distributed is the bundle, and the
          # minifier throws comments away. vite.config.ts sets the header; here
          # it is checked that it really makes it into the artefact, because
          # this obligation breaks silently.
          missing=0
          for f in dist/assets/*.js; do
            grep -q "Mozilla Public License" "$f" || { echo "no notice: $f"; missing=1; }
          done
          [ "$missing" = 0 ] || exit 1
          echo "Every bundle carries the notice."

  rollout:
    name: Roll out
    needs: [backend, frontend]
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, homelab, nexora]
    timeout-minutes: 15
    steps:
      - name: Roll out onto the Docker host
        run: |
          # The key is pinned to /opt/ci/nexora-ausrollen.sh at the target;
          # whatever stood here would make no difference anyway.
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes debian@10.0.2.43 true
