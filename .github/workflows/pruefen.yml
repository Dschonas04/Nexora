# Check and, when everything is green, roll out.
#
# Runs on the self hosted runner in the home network, the only one that reaches
# the Docker host this instance runs on. GitHub's own runners have no way there.
#
# ATTENTION, this is the reason for several things here: this repository is
# PUBLIC. A self hosted runner executes what stands in the workflow, and a
# contribution from outside could bring the workflow along. Therefore:
#
#   * NO pull_request trigger. Only what already lies in the repository is
#     built, and only somebody with write access may create branches.
#   * The runner has NO Docker socket of the host (unlike the runners of the
#     private repositories). Building and checking happen in the runner itself.
#   * The key for the rollout is pinned to exactly one command at the target: it
#     can roll out the state of origin/main and nothing else.
name: Prüfen und ausrollen

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  # Two runs on the same instance would be a race for the same Docker compound.
  # The newer one wins.
  group: nexora
  cancel-in-progress: true

jobs:

  backend:
    name: Backend
    runs-on: [self-hosted, homelab, nexora]
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Quellen holen
        uses: actions/checkout@v4

      - name: Fassungen nennen
        run: go version

      - name: Satz prüfen
        run: |
          # gofmt reports deviations only by printing file names, so an empty
          # output stream is the pass. metriken.go is generated and was never
          # formatted; it stays out.
          abweichend=$(gofmt -l . | grep -v 'internal/dok/metriken.go' || true)
          if [ -n "$abweichend" ]; then
            echo "Nicht mit gofmt gesetzt:"
            echo "$abweichend"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: Prüfungen
        run: go test ./...

      - name: Übersetzen
        run: go build ./...

      - name: Rauchtest gegen eine echte Datenbank
        run: |
          # The checks above touch no database. That is exactly where the errors
          # sit that one only sees in operation.
          ./test/rauchtest.sh

  frontend:
    name: Frontend
    runs-on: [self-hosted, homelab, nexora]
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Quellen holen
        uses: actions/checkout@v4

      - name: Fassungen nennen
        run: node --version && npm --version

      - name: Abhängigkeiten holen
        # npm ci and not npm install: exactly what stands in package-lock.json
        # shall be built, and not whatever happens to be new today.
        run: npm ci

      - name: Typen prüfen
        run: npx tsc --noEmit -p .

      - name: Bauen
        run: npm run build

      - name: Der Lizenzhinweis muss im Bündel stehen
        run: |
          # BlockNote steht unter MPL-2.0, und die verlangt, dass der Hinweis
          # die VERTEILTE Form begleitet. Verteilt wird das Buendel, und der
          # Minimierer wirft Kommentare weg. Den Kopf setzt vite.config.ts;
          # hier wird geprueft, dass er es wirklich bis ins Erzeugnis schafft,
          # denn diese Auflage bricht lautlos.
          fehlend=0
          for f in dist/assets/*.js; do
            grep -q "Mozilla Public License" "$f" || { echo "ohne Hinweis: $f"; fehlend=1; }
          done
          [ "$fehlend" = 0 ] || exit 1
          echo "Alle Bündel tragen den Hinweis."

  ausrollen:
    name: Ausrollen
    needs: [backend, frontend]
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, homelab, nexora]
    timeout-minutes: 15
    steps:
      - name: Auf den Docker-Host ausrollen
        run: |
          # The key is pinned to /opt/ci/nexora-ausrollen.sh at the target;
          # whatever stood here would make no difference anyway.
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes debian@10.0.2.43 true
