<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>Nexora einrichten</title>
<style>
  :root { --grund: #f7f7f6; --text: #37352f; --leise: #86847f; --rand: #e3e2de; --feld: #fff; --knopf: #191919; --knopftext: #fff; --fehler: #c4382f; }
  @media (prefers-color-scheme: dark) {
    :root { --grund: #191919; --text: #e6e5e3; --leise: #9b9a97; --rand: #353535; --feld: #232323; --knopf: #e6e5e3; --knopftext: #191919; --fehler: #ff7b72; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--grund); color: var(--text);
         font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; padding: 24px; }
  main { width: min(420px, 100%); }
  .zeichen { margin-bottom: 20px; line-height: 0; }
  h1 { font-size: 22px; margin: 0 0 6px; }
  p { color: var(--leise); margin: 0 0 20px; }
  label { display: block; font-weight: 500; margin-bottom: 6px; }
  input { width: 100%; padding: 9px 11px; border: 1px solid var(--rand); border-radius: 7px; background: var(--feld); color: var(--text); font: inherit; }
  input:focus { outline: 2px solid #2383e2; outline-offset: -1px; }
  .knoepfe { display: flex; gap: 8px; margin-top: 14px; }
  button { padding: 8px 14px; border-radius: 7px; border: 1px solid var(--rand); background: transparent; color: var(--text); font: inherit; cursor: pointer; }
  button.haupt { background: var(--knopf); color: var(--knopftext); border-color: var(--knopf); }
  button:disabled { opacity: .5; cursor: default; }
  .meldung { min-height: 21px; margin-top: 12px; font-size: 13px; }
  .meldung.fehler { color: var(--fehler); }
  .hinweis { font-size: 12px; margin-top: 24px; }
</style>
</head>
<body>
<main>
  <div class="zeichen"><svg width="48" height="48" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><rect width="64" height="64" rx="15" fill="#111"/><path d="M20 44V20L44 44V20" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><g fill="#fff"><circle cx="20" cy="44" r="5.5"/><circle cx="20" cy="20" r="5.5"/><circle cx="44" cy="44" r="5.5"/><circle cx="44" cy="20" r="5.5"/></g></svg>
</div>
  <h1>Nexora einrichten</h1>
  <p>Mit welchem Server soll sich die App verbinden? Unterwegs arbeitest du auf einer Kopie deiner Seiten, zuhause wird abgeglichen.</p>
  <form id="form">
    <label for="adresse">Adresse des Servers</label>
    <input id="adresse" placeholder="https://10.0.2.7:3000" autocomplete="url" spellcheck="false" required>
    <div class="knoepfe">
      <button class="haupt" id="los" type="submit">Verbinden</button>
    </div>
    <div class="meldung" id="meldung" role="status"></div>
  </form>
  <p class="hinweis">Später änderbar im Menü unter „Server wechseln …“.</p>
</main>
<script>
  const feld = document.getElementById('adresse');
  const meldung = document.getElementById('meldung');
  const los = document.getElementById('los');
  window.nexoraEinrichtung.adresse().then((a) => { if (a) feld.value = a; feld.focus(); });
  document.getElementById('form').addEventListener('submit', async (e) => {
    e.preventDefault();
    let a = feld.value.trim().replace(/\/+$/, '');
    if (!/^https?:\/\//.test(a)) a = 'https://' + a;
    feld.value = a;
    los.disabled = true;
    meldung.className = 'meldung';
    meldung.textContent = 'Prüfe …';
    const ergebnis = await window.nexoraEinrichtung.pruefen(a);
    if (!ergebnis.ok) {
      meldung.className = 'meldung fehler';
      meldung.textContent = ergebnis.fehler;
      los.disabled = false;
      return;
    }
    meldung.textContent = 'Verbunden.';
    await window.nexoraEinrichtung.speichern(a);
  });
</script>
</body>
</html>
