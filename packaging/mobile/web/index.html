<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nexora</title>
<style>
  :root { --grund: #f7f7f6; --text: #37352f; --leise: #86847f; --rand: #e3e2de; --feld: #fff; --knopf: #191919; --knopftext: #fff; --fehler: #c4382f; }
  @media (prefers-color-scheme: dark) {
    :root { --grund: #191919; --text: #e6e5e3; --leise: #9b9a97; --rand: #353535; --feld: #232323; --knopf: #e6e5e3; --knopftext: #191919; --fehler: #ff7b72; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--grund); color: var(--text);
         font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; padding: 24px 16px; }
  main { width: min(420px, 100%); }
  .zeichen { margin-bottom: 20px; line-height: 0; }
  h1 { font-size: 24px; margin: 0 0 6px; }
  p { color: var(--leise); margin: 0 0 20px; }
  label { display: block; font-weight: 500; margin-bottom: 6px; }
  input { width: 100%; padding: 12px; border: 1px solid var(--rand); border-radius: 8px; background: var(--feld); color: var(--text); font: inherit; }
  .knoepfe { display: flex; gap: 8px; margin-top: 14px; flex-wrap: wrap; }
  button { padding: 11px 16px; border-radius: 8px; border: 1px solid var(--rand); background: transparent; color: var(--text); font: inherit; }
  button.haupt { background: var(--knopf); color: var(--knopftext); border-color: var(--knopf); }
  button:disabled { opacity: .5; }
  .meldung { min-height: 24px; margin-top: 12px; font-size: 14px; }
  .meldung.fehler { color: var(--fehler); }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <div class="zeichen"><svg width="48" height="48" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><rect width="64" height="64" rx="15" fill="#111"/><path d="M20 44V20L44 44V20" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><g fill="#fff"><circle cx="20" cy="44" r="5.5"/><circle cx="20" cy="20" r="5.5"/><circle cx="44" cy="44" r="5.5"/><circle cx="44" cy="20" r="5.5"/></g></svg></div>

  <section id="weiter" hidden>
    <h1>Nexora</h1>
    <p id="ziel"></p>
    <div class="knoepfe">
      <button class="haupt" id="jetzt">Öffnen</button>
      <button id="wechseln">Server wechseln</button>
    </div>
  </section>

  <section id="einrichten" hidden>
    <h1>Nexora einrichten</h1>
    <p>Mit welchem Server soll sich die App verbinden? Unterwegs arbeitest du auf einer Kopie deiner Seiten, zuhause wird abgeglichen.</p>
    <form id="form">
      <label for="adresse">Adresse des Servers</label>
      <input id="adresse" type="url" inputmode="url" placeholder="https://10.0.2.7:3000" autocapitalize="off" spellcheck="false" required>
      <div class="knoepfe"><button class="haupt" id="los" type="submit">Verbinden</button></div>
      <div class="meldung" id="meldung" role="status"></div>
    </form>
  </section>
</main>
<script>
  const app = window.NexoraApp;
  const gespeichert = app ? app.server() : '';
  const oeffnen = (a) => location.replace(a + '/');
  let timer = 0;

  function einrichten() {
    clearTimeout(timer);
    document.getElementById('weiter').hidden = true;
    document.getElementById('einrichten').hidden = false;
    const feld = document.getElementById('adresse');
    feld.value = gespeichert || '';
    feld.focus();
  }

  if (gespeichert) {
    document.getElementById('weiter').hidden = false;
    document.getElementById('ziel').textContent = 'Verbinde mit ' + gespeichert + ' …';
    document.getElementById('jetzt').onclick = () => oeffnen(gespeichert);
    document.getElementById('wechseln').onclick = einrichten;
    timer = setTimeout(() => oeffnen(gespeichert), 1200);
  } else {
    einrichten();
  }

  document.getElementById('form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const feld = document.getElementById('adresse');
    const meldung = document.getElementById('meldung');
    const los = document.getElementById('los');
    let a = feld.value.trim().replace(/\/+$/, '');
    if (!/^https?:\/\//.test(a)) a = 'https://' + a;
    feld.value = a;
    los.disabled = true;
    meldung.className = 'meldung';
    meldung.textContent = 'Prüfe …';
    try {
      // no-cors: die Antwort bleibt verborgen, aber ein Fehler heisst, der
      // Server ist nicht erreichbar oder sein Zertifikat gilt nicht.
      await fetch(a + '/healthz', { mode: 'no-cors', signal: AbortSignal.timeout(8000) });
    } catch {
      meldung.className = 'meldung fehler';
      meldung.textContent = 'Der Server ist nicht erreichbar. Stimmt die Adresse, und bist du im selben Netz?';
      los.disabled = false;
      return;
    }
    if (!app || !app.setzen(a)) {
      meldung.className = 'meldung fehler';
      meldung.textContent = 'Die Adresse konnte nicht gespeichert werden.';
      los.disabled = false;
      return;
    }
    meldung.textContent = 'Verbunden.';
    oeffnen(new URL(a).origin);
  });
</script>
</body>
</html>
