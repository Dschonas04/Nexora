# Side file: a Redis as a cache.
#
# Optional, and really so: without it Nexora runs completely, only with one
# database query more per request. It pays off as soon as several instances run
# side by side, because then they share what they know about sessions, or when
# the database is short of breath anyway.
#
#     docker compose -f docker-compose.yml -f docker-compose.db.yml \
#                    -f docker-compose.redis.yml up -d
#
# Whatever lies in it also stands in the database. This service therefore
# deliberately has NO volume: a Redis losing its content is no damage here but a
# cold start.
services:
  redis:
    image: redis:7-alpine
    # No saving to disk (--save "" switches the snapshots off) and an upper
    # limit for the memory: when it fills up the oldest entries are thrown out
    # instead of the service giving up.
    command:
      - redis-server
      - --save
      - ""
      - --appendonly
      - "no"
      - --maxmemory
      - ${REDIS_SPEICHER:-128mb}
      - --maxmemory-policy
      - allkeys-lru
      # Encrypted and ONLY encrypted: --port 0 shuts the open door. Session ids
      # lie here, and whoever reads one along is signed in.
      - --port
      - "0"
      - --tls-port
      - "6379"
      - --tls-cert-file
      - /pki/redis/redis.crt
      - --tls-key-file
      - /pki/redis/redis.key
      - --tls-ca-cert-file
      - /pki/ca.crt
      # The service identifies itself with a password and not with a
      # certificate. A second certificate per client would be more
      # administration than this wire is worth.
      - --tls-auth-clients
      - "no"
    depends_on:
      pki:
        condition: service_completed_successfully
    volumes:
      - nexora_pki:/pki:ro
    healthcheck:
      # The probe has to ask encrypted now too, otherwise it reports the
      # service dead while it is running.
      test: ["CMD", "redis-cli", "--tls", "--cacert", "/pki/ca.crt", "-h", "redis", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  backend:
    environment:
      NEXORA_REDIS_ADRESSE: ${NEXORA_REDIS_ADRESSE:-redis:6379}
      NEXORA_REDIS_VORSILBE: ${NEXORA_REDIS_VORSILBE:-nexora}
      NEXORA_REDIS_TLS: "ja"
    depends_on:
      redis:
        condition: service_healthy
