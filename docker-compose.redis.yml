# Side file: a Redis as a cache.
#
# Optional, and really so: without it Nexora runs completely, only with one
# database query more per request. It pays off as soon as several instances run
# side by side, because then they share what they know about sessions, or when
# the database is short of breath anyway.
#
#     docker compose -f docker-compose.yml -f docker-compose.db.yml \
#                    -f docker-compose.redis.yml up -d
#
# Whatever lies in it also stands in the database. This service therefore
# deliberately has NO volume: a Redis losing its content is no damage here but a
# cold start.
services:
  redis:
    image: redis:7-alpine
    # No saving to disk (--save "" switches the snapshots off) and an upper
    # limit for the memory: when it fills up the oldest entries are thrown out
    # instead of the service giving up.
    command:
      - redis-server
      - --save
      - ""
      - --appendonly
      - "no"
      - --maxmemory
      - ${REDIS_SPEICHER:-128mb}
      - --maxmemory-policy
      - allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  backend:
    environment:
      NEXORA_REDIS_ADRESSE: ${NEXORA_REDIS_ADRESSE:-redis:6379}
      NEXORA_REDIS_VORSILBE: ${NEXORA_REDIS_VORSILBE:-nexora}
    depends_on:
      redis:
        condition: service_healthy
