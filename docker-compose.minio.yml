# Side file: a MinIO for the attachments.
#
# Without this file attachments lie on the backend's disk, which is enough for an
# instance on a single machine. The object store pays off as soon as the
# attachments are to be backed up, shared or placed on another device on their
# own.
#
# Whoever already runs a MinIO or an S3 service does NOT take this file but
# enters the existing credentials as NEXORA_S3_* in the .env.
#
#     docker compose -f docker-compose.yml -f docker-compose.db.yml \
#                    -f docker-compose.minio.yml up -d
#
# Two things are deliberately made inconvenient here:
#
# 1. No password has a default. Compose aborts when one is missing. A shipped
#    "please-change-me" stays in place, in experience, and an object store with a
#    known password is an open shelf.
#
# 2. The ports listen on 127.0.0.1, not on every address. The store is there for
#    Nexora, not for the network; whoever needs it from outside sets
#    MINIO_ADRESSE to 0.0.0.0 explicitly and puts TLS in front of it.
services:
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?bitte in der .env setzen}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?bitte in der .env setzen, z.B. openssl rand -hex 24}
    volumes:
      - nexora_s3:/data
    ports:
      # First number: the S3 interface. Second: the web interface.
      - "${MINIO_ADRESSE:-127.0.0.1}:${MINIO_PORT:-9010}:9000"
      - "${MINIO_ADRESSE:-127.0.0.1}:${MINIO_KONSOLE_PORT:-9011}:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped

  # One time setup: create the bucket and an account of its own for Nexora that
  # may see only this one bucket.
  #
  # The root account is the administrator of the store; it may create accounts,
  # change rules and delete every bucket. Handing it to an application means
  # turning every fault in it into full access. Nexora needs reading and writing
  # in one bucket, no more.
  #
  # The run is repeatable: everything here tolerates having been done already.
  minio-einrichten:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?bitte in der .env setzen}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?bitte in der .env setzen}
      EIMER: ${NEXORA_S3_BUCKET:-nexora}
      SCHLUESSEL: ${NEXORA_S3_ZUGRIFFSSCHLUESSEL:?bitte in der .env setzen}
      GEHEIMNIS: ${NEXORA_S3_GEHEIMNIS:?bitte in der .env setzen, z.B. openssl rand -hex 24}
    entrypoint: /bin/sh
    command:
      - -c
      - |
        set -e
        mc alias set eigen http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"
        mc mb --ignore-existing eigen/"$$EIMER"
        cat > /tmp/regel.json <<REGEL
        {
          "Version": "2012-10-17",
          "Statement": [
            {
              "Effect": "Allow",
              "Action": ["s3:ListBucket", "s3:GetBucketLocation"],
              "Resource": ["arn:aws:s3:::$$EIMER"]
            },
            {
              "Effect": "Allow",
              "Action": ["s3:GetObject", "s3:PutObject", "s3:DeleteObject"],
              "Resource": ["arn:aws:s3:::$$EIMER/*"]
            }
          ]
        }
        REGEL
        mc admin user add eigen "$$SCHLUESSEL" "$$GEHEIMNIS" 2>/dev/null || true
        mc admin policy create eigen nexora-eimer /tmp/regel.json 2>/dev/null || true
        mc admin policy attach eigen nexora-eimer --user "$$SCHLUESSEL" 2>/dev/null || true
        echo "MinIO eingerichtet: Eimer $$EIMER, Konto $$SCHLUESSEL darf nur dorthin."
    restart: "no"

  backend:
    environment:
      # Here the container name counts, not the published port: the backend
      # talks to MinIO over the compound's network.
      NEXORA_S3_AKTIV: "ja"
      NEXORA_S3_ENDPUNKT: ${NEXORA_S3_ENDPUNKT:-http://minio:9000}
      NEXORA_S3_BUCKET: ${NEXORA_S3_BUCKET:-nexora}
      # The restricted account from above, not the root one.
      NEXORA_S3_ZUGRIFFSSCHLUESSEL: ${NEXORA_S3_ZUGRIFFSSCHLUESSEL:?bitte in der .env setzen}
      NEXORA_S3_GEHEIMNIS: ${NEXORA_S3_GEHEIMNIS:?bitte in der .env setzen}
      # MinIO speaks path style, not Amazon's subdomains.
      NEXORA_S3_PFADSTIL: "ja"
    depends_on:
      minio-einrichten:
        condition: service_completed_successfully

volumes:
  nexora_s3:
