manifestVersion: 1
id: nexora
name: Nexora
tagline: Self-hosted wiki with backlinks and a knowledge graph
category: files
version: "2.0.0"
port: 3000
description: >-
  A small self-hosted knowledge base: think Notion or Outline, but small and
  yours.


  Nested pages in a block editor, spaces with per-user roles, wiki links that
  produce backlinks on the other side, a knowledge graph over the whole
  instance, version history, comments, attachments on local disk or in any
  S3-compatible bucket, a self-emptying trash, PostgreSQL full text search,
  public share links, and import from Obsidian, Notion and Confluence exports.
  Markdown, PDF and Word export are free and stay free.


  A Go service, a React interface, PostgreSQL. What it does not do: real-time
  editing in one page (a save that would overwrite somebody is refused instead),
  Notion-style databases, plugins or AI.


  The first account that registers becomes the administrator, so open it once
  yourself right after installing.
releaseNotes: >-
  First published release. Images for amd64 and arm64, a one-file stack, and a
  comparison against the alternatives. See
