apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: nexora-frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nexora-frontend
    spec:
      containers:
        - name: frontend
          image: ghcr.io/dschonas04/nexora-frontend
          ports:
            - name: http
              containerPort: 80
          env:
            # No internal certificate authority here: inside the cluster the
            # interface talks plain HTTP to the service, and TLS ends at the
            # ingress.
            - name: NEXORA_SERVICE_SCHEME
              value: http
            - name: NEXORA_SERVICE_PORT
              value: "8080"
            # The address the instance is reached under, for links in mails
            # and for search engines. Keep it in line with ingress.yaml.
            # - name: NEXORA_PUBLIC_URL
            #   value: https://nexora.example.org
          volumeMounts:
            - name: tls
              mountPath: /etc/nginx/tls
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              memory: 128Mi
      volumes:
        # The certificate nginx issues itself for its own port 443, unused
        # behind the ingress. It is made again on every start.
        - name: tls
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
spec:
  selector:
    app.kubernetes.io/name: nexora-frontend
  ports:
    - name: http
      port: 80
      targetPort: http
